    <text x="1211" y="296" text-anchor="middle" class="module-title" fill="#3f2d7d">Independent Validation</text>
    <text x="1211" y="316" text-anchor="middle" class="module-sub">fresh source review · Finding projection</text>

    <rect x="676" y="423" width="190" height="70" rx="11" fill="#f7f4ff" stroke="#7457c5" stroke-width="1.6" />
    <text x="771" y="449" text-anchor="middle" class="module-title" fill="#3f2d7d">Model Execution</text>
