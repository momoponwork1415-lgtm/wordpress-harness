    <text x="1211" y="477" text-anchor="middle" class="module-sub">append-only · artifacts · replay</text>

    <rect x="676" y="582" width="190" height="90" rx="11" fill="#fff2f1" stroke="#c85b51" stroke-width="1.5" stroke-dasharray="7 5" />
