    <text x="771" y="634" text-anchor="middle" class="module-sub">fresh context · isolated scratch</text>
    <text x="771" y="652" text-anchor="middle" class="module-sub">no ambient shell / network</text>

    <ellipse cx="991" cy="594" rx="95" ry="15" fill="#edf1f7" stroke="#64748b" />
    <rect x="896" y="594" width="190" height="65" fill="#edf1f7" stroke="#64748b" />
    <ellipse cx="991" cy="659" rx="95" ry="15" fill="#edf1f7" stroke="#64748b" />
    <text x="991" y="624" text-anchor="middle" class="module-title">Immutable Target Snapshot</text>
    <text x="991" y="646" text-anchor="middle" class="module-sub">untrusted · manifest-bound</text>

