<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1080" viewBox="0 0 1800 1080" role="img" aria-labelledby="title desc">
  <title id="title">WordPress Semantic Security Research Harness whole-system architecture</title>
  <desc id="desc">Autonomous target selection, human batch approval, unattended Opus research, source validation, AI reproduction, mandatory human reproduction, report approval, and human submission across three ownership contexts.</desc>
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#172033" flood-opacity="0.12" />
    </filter>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#4d86c6" /></marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7457c5" /></marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#3a9567" /></marker>
    <marker id="arrow-gold" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#c79a20" /></marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#c85b51" /></marker>
    <style>
      text { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #273449; }
      .title { font-size: 30px; font-weight: 750; fill: #172033; }
      .subtitle { font-size: 15px; fill: #526078; }
      .mission { font-size: 15px; font-weight: 700; fill: white; }
      .zone-title { font-size: 16px; font-weight: 800; letter-spacing: 1.6px; }
      .module-title { font-size: 14px; font-weight: 750; }
      .module-sub { font-size: 11.5px; fill: #526078; }
      .small { font-size: 11px; fill: #526078; }
      .label { font-size: 11px; font-weight: 700; }
      .ownership { font-size: 14px; font-weight: 700; fill: #273449; }
      .edge-blue { fill: none; stroke: #4d86c6; stroke-width: 2.4; marker-end: url(#arrow-blue); }
      .edge-purple { fill: none; stroke: #7457c5; stroke-width: 2.4; marker-end: url(#arrow-purple); }
      .edge-green { fill: none; stroke: #3a9567; stroke-width: 2.4; marker-end: url(#arrow-green); }
      .edge-gold { fill: none; stroke: #c79a20; stroke-width: 2.6; marker-end: url(#arrow-gold); }
      .edge-red { fill: none; stroke: #c85b51; stroke-width: 2; stroke-dasharray: 7 5; marker-end: url(#arrow-red); }
      .edge-muted { fill: none; stroke: #7b8798; stroke-width: 1.8; stroke-dasharray: 6 5; marker-end: url(#arrow-purple); }
      .edge-record { fill: none; stroke: #7457c5; stroke-width: 1.7; stroke-dasharray: 5 4; marker-end: url(#arrow-purple); }
    </style>
  </defs>

  <rect width="1800" height="1080" fill="#ffffff" />
  <text x="42" y="49" class="title">WordPress Semantic Security Research Harness</text>
  <text x="42" y="77" class="subtitle">Three ownership contexts · Independent Validation Findings · human-authorized submission</text>
  <rect x="40" y="100" width="1720" height="58" rx="12" fill="#172033" />
  <text x="900" y="135" text-anchor="middle" class="mission">Operating loop: select → approve batch → semantic research → independent validation → Finding → runtime verify → authorize external action</text>

