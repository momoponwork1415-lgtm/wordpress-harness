    <rect x="1584" y="674" width="150" height="64" rx="11" fill="white" stroke="#3a9567" stroke-width="1.6" />
    <text x="1659" y="699" text-anchor="middle" class="module-title" font-size="12" fill="#205e42">Human Submit</text>
    <text x="1659" y="719" text-anchor="middle" class="module-sub">explicit authorization</text>
  </g>

