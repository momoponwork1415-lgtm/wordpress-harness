    <rect x="1416" y="338" width="318" height="58" rx="11" fill="white" stroke="#3a9567" stroke-width="1.6" />
    <text x="1575" y="361" text-anchor="middle" class="module-title" fill="#205e42">Vulnerability Understanding</text>
    <text x="1575" y="381" text-anchor="middle" class="module-sub">source route · impact · scenario · recipe</text>

    <rect x="1416" y="418" width="318" height="66" rx="11" fill="white" stroke="#3a9567" stroke-width="1.8" />
