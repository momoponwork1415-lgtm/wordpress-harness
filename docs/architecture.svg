    <rect x="66" y="260" width="278" height="56" rx="11" fill="white" stroke="#8c98aa" />
    <text x="205" y="283" text-anchor="middle" class="module-title">Ecosystem Observation</text>
    <text x="205" y="302" text-anchor="middle" class="module-sub">WordPress.org · programmes · disclosure routes</text>

    <rect x="66" y="338" width="278" height="58" rx="11" fill="white" stroke="#4d86c6" stroke-width="1.6" />
    <text x="205" y="361" text-anchor="middle" class="module-title" fill="#173b64">Autonomous Target Selection</text>
    <text x="205" y="381" text-anchor="middle" class="module-sub">oracle-free reasons · diverse Candidate Batch</text>

    <rect x="66" y="418" width="278" height="58" rx="11" fill="#eaf3ff" stroke="#4d86c6" stroke-width="1.8" />
    <text x="205" y="441" text-anchor="middle" class="module-title" fill="#173b64">Human Batch Approval</text>
    <text x="205" y="461" text-anchor="middle" class="module-sub">approve · exclude · reorder · nominate</text>

    <rect x="66" y="498" width="278" height="72" rx="11" fill="white" stroke="#4d86c6" stroke-width="1.6" />
    <text x="205" y="523" text-anchor="middle" class="module-title" fill="#173b64">Freshness &amp; Campaign Dispatch</text>
    <text x="205" y="544" text-anchor="middle" class="module-sub">durable queue · target isolation</text>
    <text x="205" y="560" text-anchor="middle" class="small">many waiting · about 5 active</text>

    <ellipse cx="132" cy="644" rx="64" ry="13" fill="#d7e9ff" stroke="#4d86c6" />
    <rect x="68" y="644" width="128" height="55" fill="#d7e9ff" stroke="#4d86c6" />
    <ellipse cx="132" cy="699" rx="64" ry="13" fill="#d7e9ff" stroke="#4d86c6" />
    <text x="132" y="666" text-anchor="middle" class="module-title" font-size="12">History / Receipts</text>
    <text x="132" y="684" text-anchor="middle" class="module-sub">resume · dedupe</text>

