<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1040" viewBox="0 0 1600 1040" role="img" aria-labelledby="title desc">
  <title id="title">Minimal Finding lifecycle migration</title>
  <desc id="desc">Current Semantic Research Wave and conditional Depth remain. Independent Validation creates a Finding, runtime and human verification append records, and a human authorizes only external action.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L9,3 L0,6 Z" fill="#42526e"/></marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L9,3 L0,6 Z" fill="#23875f"/></marker>
    <style>
      .bg{fill:#f7f9fc}.frame{fill:#fff;stroke:#c8d1df;stroke-width:2}.context{fill:#edf3ff;stroke:#5b7cba;stroke-width:2}.kept{fill:#eef6ff;stroke:#4d78a8;stroke-width:2}.changed{fill:#fff4cc;stroke:#c59016;stroke-width:2}.human{fill:#e7f7ee;stroke:#23875f;stroke-width:2}.legacy{fill:#fff0f0;stroke:#c24f4f;stroke-width:2;stroke-dasharray:8 6}.line{fill:none;stroke:#42526e;stroke-width:2.4;marker-end:url(#arrow)}.gate{fill:none;stroke:#23875f;stroke-width:2.8;marker-end:url(#arrow-green)}.dash{fill:none;stroke:#9b6670;stroke-width:2;stroke-dasharray:7 6}.title{font:700 30px Inter,Segoe UI,sans-serif;fill:#172033}.subtitle{font:16px Inter,Segoe UI,sans-serif;fill:#526078}.h{font:700 18px Inter,Segoe UI,sans-serif;fill:#172033}.label{font:700 15px Inter,Segoe UI,sans-serif;fill:#273449}.small{font:13px Inter,Segoe UI,sans-serif;fill:#526078}.tiny{font:12px Inter,Segoe UI,sans-serif;fill:#526078}.badge{font:700 12px Inter,Segoe UI,sans-serif;fill:#fff}.mono{font:13px ui-monospace,SFMono-Regular,Consolas,monospace;fill:#273449}
    </style>
  </defs>
  <rect class="bg" width="1600" height="1040"/>
  <text x="48" y="54" class="title">Minimal migration — keep the research engine, replace the lifecycle</text>
  <text x="48" y="83" class="subtitle">Accepted direction: reference-harness principles without copying their stage graph</text>

  <rect x="48" y="112" width="1504" height="782" rx="18" class="frame"/>

  <rect x="78" y="150" width="300" height="685" rx="15" class="context"/>
  <text x="100" y="185" class="h">Target Intelligence</text>
  <rect x="105" y="225" width="246" height="78" rx="12" class="kept"/>
  <text x="228" y="255" text-anchor="middle" class="label">Oracle-free selection</text>
  <text x="228" y="279" text-anchor="middle" class="small">history aggregate · freshness</text>
  <path d="M228 303V342" class="line"/>
  <rect x="105" y="342" width="246" height="78" rx="12" class="human"/>
  <text x="228" y="372" text-anchor="middle" class="label">Human batch approval</text>
  <text x="228" y="396" text-anchor="middle" class="small">existing safety boundary</text>
  <path d="M228 420V459" class="line"/>
  <rect x="105" y="459" width="246" height="78" rx="12" class="kept"/>
  <text x="228" y="489" text-anchor="middle" class="label">Target Intake Packet</text>
  <text x="228" y="513" text-anchor="middle" class="small">fixed version · manifest</text>
  <rect x="105" y="650" width="246" height="120" rx="12" class="kept"/>
  <text x="228" y="682" text-anchor="middle" class="label">No new control plane</text>
  <text x="228" y="708" text-anchor="middle" class="small">current public seams stay</text>
  <text x="228" y="732" text-anchor="middle" class="small">dispatch remains separate work</text>
  <text x="228" y="756" text-anchor="middle" class="small">until pilot evidence exists</text>

  <rect x="408" y="150" width="670" height="685" rx="15" class="context"/>
  <text x="430" y="185" class="h">Research — current internals retained</text>
  <rect x="445" y="225" width="180" height="78" rx="12" class="kept"/>
  <text x="535" y="255" text-anchor="middle" class="label">Source Understanding</text>
  <text x="535" y="279" text-anchor="middle" class="small">inventory · maps · query</text>
  <path d="M625 264H667" class="line"/>
  <rect x="667" y="225" width="180" height="78" rx="12" class="kept"/>
  <text x="757" y="255" text-anchor="middle" class="label">Semantic Wave</text>
  <text x="757" y="279" text-anchor="middle" class="small">3 independent theses</text>
  <path d="M847 264H889" class="line"/>
  <rect x="889" y="225" width="152" height="78" rx="12" class="kept"/>
  <text x="965" y="255" text-anchor="middle" class="label">Root Evaluation</text>
  <text x="965" y="279" text-anchor="middle" class="small">admit or retain gap</text>

  <path d="M757 303V352H640" class="line"/>
  <rect x="490" y="352" width="300" height="94" rx="12" class="kept"/>
  <text x="640" y="382" text-anchor="middle" class="label">Conditional Depth</text>
  <text x="640" y="406" text-anchor="middle" class="small">Synthesis · Critic · missing-link</text>
  <text x="640" y="428" text-anchor="middle" class="small">only for a strong semantic frontier</text>
  <path d="M790 399H850" class="line"/>
  <rect x="850" y="352" width="191" height="94" rx="12" class="changed"/>
  <text x="945" y="382" text-anchor="middle" class="label">Independent Validation</text>
  <text x="945" y="406" text-anchor="middle" class="small">fresh source-only attempt</text>
  <text x="945" y="428" text-anchor="middle" class="small">only writer of Findings</text>

  <path d="M945 446V493" class="line"/>
  <rect x="795" y="493" width="246" height="98" rx="12" class="changed"/>
  <text x="918" y="525" text-anchor="middle" class="label">Finding</text>
  <text x="918" y="550" text-anchor="middle" class="mono">assurance: source-validated</text>
  <text x="918" y="574" text-anchor="middle" class="small">immutable causal claim</text>

  <rect x="445" y="493" width="290" height="98" rx="12" class="kept"/>
  <text x="590" y="525" text-anchor="middle" class="label">Coverage / Incomplete</text>
  <text x="590" y="550" text-anchor="middle" class="small">separate from Finding existence</text>
  <text x="590" y="574" text-anchor="middle" class="small">budget failure is not “safe”</text>

  <rect x="445" y="650" width="596" height="120" rx="12" class="legacy"/>
  <text x="743" y="682" text-anchor="middle" class="label">Replace after the vertical slice proves itself</text>
  <text x="743" y="708" text-anchor="middle" class="small">Runtime Verification Packet writer · Triage Packet writer</text>
  <text x="743" y="732" text-anchor="middle" class="small">human-only Finding writer · duplicate queue choreography</text>
  <text x="743" y="756" text-anchor="middle" class="small">old artifacts remain read-only replay; new production path stays singular</text>

  <rect x="1108" y="150" width="414" height="685" rx="15" class="context"/>
  <text x="1130" y="185" class="h">Human OS</text>
  <rect x="1142" y="225" width="346" height="78" rx="12" class="changed"/>
  <text x="1315" y="255" text-anchor="middle" class="label">AI Reproduction</text>
  <text x="1315" y="279" text-anchor="middle" class="small">Finding in · Verification Record out</text>
  <path d="M1315 303V342" class="line"/>
  <rect x="1142" y="342" width="346" height="78" rx="12" class="changed"/>
  <text x="1315" y="372" text-anchor="middle" class="label">Optional human verification</text>
  <text x="1315" y="396" text-anchor="middle" class="small">adds assurance; does not create Finding</text>
  <path d="M1315 420V459" class="line"/>
  <rect x="1142" y="459" width="346" height="96" rx="12" class="kept"/>
  <text x="1315" y="490" text-anchor="middle" class="label">Analysis · duplicate check · draft</text>
  <text x="1315" y="515" text-anchor="middle" class="small">may run at any declared assurance level</text>
  <text x="1315" y="539" text-anchor="middle" class="small">never implies external permission</text>
  <path d="M1315 555V603" class="gate"/>
  <rect x="1142" y="603" width="346" height="96" rx="12" class="human"/>
  <text x="1315" y="634" text-anchor="middle" class="label">Human external-action authorization</text>
  <text x="1315" y="659" text-anchor="middle" class="small">exact draft revision · destination</text>
  <text x="1315" y="683" text-anchor="middle" class="small">required for staging / contact / submit</text>

  <path d="M351 498H408" class="line"/>
  <path d="M1041 542H1108" class="line"/>

  <rect x="48" y="920" width="1504" height="82" rx="14" class="frame"/>
  <rect x="74" y="944" width="18" height="18" rx="4" class="kept"/><text x="102" y="958" class="small">existing implementation retained</text>
  <rect x="340" y="944" width="18" height="18" rx="4" class="changed"/><text x="368" y="958" class="small">contract/writer changed</text>
  <rect x="590" y="944" width="18" height="18" rx="4" class="human"/><text x="618" y="958" class="small">human authorization boundary</text>
  <rect x="920" y="944" width="18" height="18" rx="4" class="legacy"/><text x="948" y="958" class="small">removed after pilot; replay only</text>
  <text x="74" y="985" class="tiny">New concepts: Finding + Verification Record. Research strategy changes require separate evidence and are not part of this migration.</text>
</svg>
