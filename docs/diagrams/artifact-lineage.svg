<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="680" viewBox="0 0 1600 680" role="img" aria-labelledby="title desc">
  <title id="title">Artifact Lineage</title>
  <desc id="desc">Target選定からFindingとApproved Draftまでのartifact変換。</desc>
  <defs>
    <style>
      text { font-family: Inter, "Noto Sans JP", "Segoe UI", sans-serif; fill: #172033; }
      .page-title { font-size: 48px; font-weight: 800; letter-spacing: -1.5px; }
      .subtitle { font-size: 19px; fill: #536177; }
      .eyebrow { font-size: 13px; font-weight: 800; letter-spacing: 2px; fill: #367fd3; }
      .section-no { font-size: 13px; font-weight: 900; letter-spacing: 2px; fill: #367fd3; }
      .section-title { font-size: 31px; font-weight: 800; letter-spacing: -0.5px; }
      .question { font-size: 15px; font-weight: 700; fill: #536177; }
      .box-title { font-size: 16px; font-weight: 800; }
      .box-title-small { font-size: 14px; font-weight: 800; }
      .body { font-size: 13px; fill: #5f6d83; }
      .small { font-size: 11px; fill: #68768b; }
      .micro { font-size: 10px; fill: #68768b; }
      .label { font-size: 11px; font-weight: 800; letter-spacing: 0.7px; }
      .white { fill: #ffffff; }
      .center { text-anchor: middle; }
      .right { text-anchor: end; }
      .panel { fill: #ffffff; stroke: #d9e0ea; stroke-width: 1.5; }
      .blue { fill: #edf5ff; stroke: #91bdeb; stroke-width: 1.5; }
      .purple { fill: #f4f0ff; stroke: #bcaee6; stroke-width: 1.5; }
      .green { fill: #eaf8f0; stroke: #8fc8aa; stroke-width: 1.5; }
      .amber { fill: #fff6df; stroke: #dcb66e; stroke-width: 1.5; }
      .red { fill: #fff0ee; stroke: #d99991; stroke-width: 1.5; }
      .gray { fill: #f5f7fa; stroke: #c8d0dc; stroke-width: 1.5; }
      .dark { fill: #172033; stroke: #172033; stroke-width: 1.5; }
      .dash { stroke-dasharray: 8 7; }
      .line { fill: none; stroke: #8190a6; stroke-width: 2; marker-end: url(#arrow); }
      .line-purple { fill: none; stroke: #7254c6; stroke-width: 2.5; marker-end: url(#arrow-purple); }
      .line-green { fill: none; stroke: #2f9363; stroke-width: 2.5; marker-end: url(#arrow-green); }
      .line-dash { fill: none; stroke: #9aa7b9; stroke-width: 2; stroke-dasharray: 7 6; marker-end: url(#arrow); }
      .divider { stroke: #d9e0ea; stroke-width: 1; }
      .timeline { stroke: #c8d0dc; stroke-width: 3; }
      .dot-purple { fill: #7254c6; stroke: #ffffff; stroke-width: 4; }
      .dot-green { fill: #2f9363; stroke: #ffffff; stroke-width: 4; }
    </style>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#1e2f4d" flood-opacity="0.08"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#8190a6"/>
    </marker>
    <marker id="arrow-purple" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#7254c6"/>
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#2f9363"/>
    </marker>
  </defs>
  <rect width="1600" height="680" fill="#f7f9fc"/>
  <g transform="translate(40 40)">
    <rect width="1520" height="600" rx="24" class="panel" filter="url(#shadow)"/>
    <text x="28" y="38" class="section-no">03 · ARTIFACT LINEAGE</text>
    <text x="28" y="78" class="section-title">処理は何を読み、何をdurableに残し、誰へ渡すか</text>
    <text x="28" y="107" class="question">会話を渡すのではなく、identity・根拠・不確実性を固定したversioned artifactを渡す。</text>

    <text x="28" y="152" class="label">TARGETを固定する</text>
    <g transform="translate(28 170)">
      <rect x="0" y="0" width="210" height="80" rx="13" class="gray"/>
      <text x="105" y="30" class="box-title-small center">Observation</text>
      <text x="105" y="52" class="small center">metadata · programme · history</text>
      <path d="M210 40 H242" class="line-purple"/>
      <rect x="252" y="0" width="210" height="80" rx="13" class="purple"/>
      <text x="357" y="30" class="box-title-small center">Selection Receipt</text>
      <text x="357" y="52" class="small center">候補 · 理由 · 不確実性</text>
      <path d="M462 40 H494" class="line-purple"/>
      <rect x="504" y="0" width="210" height="80" rx="13" class="blue"/>
      <text x="609" y="30" class="box-title-small center">Approved Batch</text>
      <text x="609" y="52" class="small center">人間判断 · 順序 · 実行枠</text>
      <path d="M714 40 H746" class="line-purple"/>
      <rect x="756" y="0" width="210" height="80" rx="13" class="purple"/>
      <text x="861" y="30" class="box-title-small center">Target Intake Packet</text>
      <text x="861" y="52" class="small center">identity · version · provenance</text>
      <path d="M966 40 H998" class="line-purple"/>
      <rect x="1008" y="0" width="210" height="80" rx="13" class="purple"/>
      <text x="1113" y="30" class="box-title-small center">Snapshot + Manifest</text>
      <text x="1113" y="52" class="small center">不変source · file digest</text>
      <path d="M1218 40 H1250" class="line-purple"/>
      <rect x="1260" y="0" width="204" height="80" rx="13" class="gray"/>
      <text x="1362" y="30" class="box-title-small center">Research History</text>
      <text x="1362" y="52" class="small center">version · status · exclusion</text>
    </g>

    <text x="28" y="292" class="label">研究判断を固定する</text>
    <g transform="translate(28 310)">
      <rect x="0" y="0" width="210" height="80" rx="13" class="purple"/>
      <text x="105" y="30" class="box-title-small center">Attempt Plan</text>
      <text x="105" y="52" class="small center">role · thesis · model · budget</text>
      <path d="M210 40 H242" class="line-purple"/>
      <rect x="252" y="0" width="210" height="80" rx="13" class="purple"/>
      <text x="357" y="30" class="box-title-small center">Tool Receipts</text>
      <text x="357" y="52" class="small center">source · bytes · digest</text>
      <path d="M462 40 H494" class="line-purple"/>
      <rect x="504" y="0" width="210" height="80" rx="13" class="purple"/>
      <text x="609" y="30" class="box-title-small center">Checkpoint</text>
      <text x="609" y="52" class="small center">Hypothesis · Route · Frontier</text>
      <path d="M714 40 H746" class="line-purple"/>
      <rect x="756" y="0" width="210" height="80" rx="13" class="purple"/>
      <text x="861" y="30" class="box-title-small center">Root Evaluation</text>
      <text x="861" y="52" class="small center">candidate · Depth · stop</text>
      <path d="M966 40 H998" class="line-purple"/>
      <rect x="1008" y="0" width="210" height="80" rx="13" class="purple"/>
      <text x="1113" y="30" class="box-title-small center">Validation Record</text>
      <text x="1113" y="52" class="small center">反証 · gap · disposition</text>
      <path d="M1218 40 H1250" class="line-purple"/>
      <rect x="1260" y="0" width="204" height="80" rx="13" class="purple"/>
      <text x="1362" y="30" class="box-title-small center">Runtime Packet</text>
      <text x="1362" y="52" class="small center">route · effect · uncertainty</text>
    </g>

    <text x="28" y="432" class="label">人間が成立を判断する</text>
    <g transform="translate(28 450)">
      <rect x="0" y="0" width="210" height="80" rx="13" class="purple"/>
      <text x="105" y="30" class="box-title-small center">AI Attempt</text>
      <text x="105" y="52" class="small center">confirmed / inconclusive</text>
      <path d="M210 40 H242" class="line-purple"/>
      <rect x="252" y="0" width="210" height="80" rx="13" class="red"/>
      <text x="357" y="30" class="box-title-small center">Private Evidence</text>
      <text x="357" y="52" class="small center">payload · request · logs</text>
      <path d="M462 40 H494" class="line-purple"/>
      <rect x="504" y="0" width="210" height="80" rx="13" class="purple"/>
      <text x="609" y="30" class="box-title-small center">Triage Packet</text>
      <text x="609" y="52" class="small center">Recipe · observation · refs</text>
      <path d="M714 40 H746" class="line-purple"/>
      <rect x="756" y="0" width="210" height="80" rx="13" class="blue"/>
      <text x="861" y="30" class="box-title-small center">Human Record</text>
      <text x="861" y="52" class="small center">fresh reproduction · result</text>
      <path d="M966 40 H998" class="line-green"/>
      <rect x="1008" y="0" width="210" height="80" rx="13" class="green"/>
      <text x="1113" y="30" class="box-title-small center">Finding</text>
      <text x="1113" y="52" class="small center">人間が昇格した技術的事実</text>
      <path d="M1218 40 H1250" class="line-green"/>
      <rect x="1260" y="0" width="204" height="80" rx="13" class="green"/>
      <text x="1362" y="30" class="box-title-small center">Approved Draft</text>
      <text x="1362" y="52" class="small center">PoC · Description · revision</text>
    </g>

    <text x="28" y="570" class="small">CASへartifactを保存してからLedger eventで参照する。digestは同一性を保証するが、脆弱性の正しさは保証しない。</text>
  </g>
</svg>
