<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="730" viewBox="0 0 1600 730" role="img" aria-labelledby="title desc">
  <title id="title">Brizy Worked Sequence</title>
  <desc id="desc">Brizy 2.8.11の実測と現行Human Verification設計への対応。</desc>
  <defs>
    <style>
      text { font-family: Inter, "Noto Sans JP", "Segoe UI", sans-serif; fill: #172033; }
      .page-title { font-size: 48px; font-weight: 800; letter-spacing: -1.5px; }
      .subtitle { font-size: 19px; fill: #536177; }
      .eyebrow { font-size: 13px; font-weight: 800; letter-spacing: 2px; fill: #367fd3; }
      .section-no { font-size: 13px; font-weight: 900; letter-spacing: 2px; fill: #367fd3; }
      .section-title { font-size: 31px; font-weight: 800; letter-spacing: -0.5px; }
      .question { font-size: 15px; font-weight: 700; fill: #536177; }
      .box-title { font-size: 16px; font-weight: 800; }
      .box-title-small { font-size: 14px; font-weight: 800; }
      .body { font-size: 13px; fill: #5f6d83; }
      .small { font-size: 11px; fill: #68768b; }
      .micro { font-size: 10px; fill: #68768b; }
      .label { font-size: 11px; font-weight: 800; letter-spacing: 0.7px; }
      .white { fill: #ffffff; }
      .center { text-anchor: middle; }
      .right { text-anchor: end; }
      .panel { fill: #ffffff; stroke: #d9e0ea; stroke-width: 1.5; }
      .blue { fill: #edf5ff; stroke: #91bdeb; stroke-width: 1.5; }
      .purple { fill: #f4f0ff; stroke: #bcaee6; stroke-width: 1.5; }
      .green { fill: #eaf8f0; stroke: #8fc8aa; stroke-width: 1.5; }
      .amber { fill: #fff6df; stroke: #dcb66e; stroke-width: 1.5; }
      .red { fill: #fff0ee; stroke: #d99991; stroke-width: 1.5; }
      .gray { fill: #f5f7fa; stroke: #c8d0dc; stroke-width: 1.5; }
      .dark { fill: #172033; stroke: #172033; stroke-width: 1.5; }
      .dash { stroke-dasharray: 8 7; }
      .line { fill: none; stroke: #8190a6; stroke-width: 2; marker-end: url(#arrow); }
      .line-purple { fill: none; stroke: #7254c6; stroke-width: 2.5; marker-end: url(#arrow-purple); }
      .line-green { fill: none; stroke: #2f9363; stroke-width: 2.5; marker-end: url(#arrow-green); }
      .line-dash { fill: none; stroke: #9aa7b9; stroke-width: 2; stroke-dasharray: 7 6; marker-end: url(#arrow); }
      .divider { stroke: #d9e0ea; stroke-width: 1; }
      .timeline { stroke: #c8d0dc; stroke-width: 3; }
      .dot-purple { fill: #7254c6; stroke: #ffffff; stroke-width: 4; }
      .dot-green { fill: #2f9363; stroke: #ffffff; stroke-width: 4; }
    </style>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#1e2f4d" flood-opacity="0.08"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#8190a6"/>
    </marker>
    <marker id="arrow-purple" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#7254c6"/>
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#2f9363"/>
    </marker>
  </defs>
  <rect width="1600" height="730" fill="#f7f9fc"/>
  <g transform="translate(40 40)">
    <rect width="1520" height="650" rx="24" class="panel" filter="url(#shadow)"/>
    <text x="28" y="38" class="section-no">04 · WORKED SEQUENCE</text>
    <text x="28" y="78" class="section-title">Brizy 2.8.11では、実際に何が起きたか</text>
    <text x="28" y="107" class="question">公開CVEを答えとして渡さないknown-case実測。左は2026-09-02の記録、右は現行設計での責任境界。</text>

    <rect x="28" y="140" width="710" height="472" rx="18" class="purple"/>
    <text x="54" y="174" class="label">実測されたRESEARCH + LEGACY VERIFICATION · 7分14秒</text>
    <line x1="80" y1="205" x2="80" y2="565" class="timeline"/>
    <circle cx="80" cy="220" r="10" class="dot-purple"/>
    <text x="110" y="212" class="small">14:06:55</text>
    <text x="110" y="235" class="box-title-small">Snapshot、budget、prompt、model、gVisor profileをdigest固定</text>
    <circle cx="80" cy="288" r="10" class="dot-purple"/>
    <text x="110" y="280" class="small">14:06:56</text>
    <text x="110" y="303" class="box-title-small">Opus 5 high × 3 Finderを0.45秒以内に独立起動</text>
    <circle cx="80" cy="356" r="10" class="dot-purple"/>
    <text x="110" y="348" class="small">14:09:38–14:10:37</text>
    <text x="110" y="371" class="box-title-small">3件のsource-bound HypothesisをWave barrierへ取込</text>
    <text x="110" y="391" class="small">Stored XSS · file-write · authorization candidate</text>
    <circle cx="80" cy="438" r="10" class="dot-purple"/>
    <text x="110" y="430" class="small">14:10:37–14:14:09</text>
    <text x="110" y="453" class="box-title-small">fresh source再導出後、sibling gVisorでWitness / Control</text>
    <text x="110" y="473" class="small">anonymous form value → stored → decode → admin hrefへunescaped output</text>
    <circle cx="80" cy="520" r="10" class="dot-purple"/>
    <text x="110" y="512" class="small">14:14:09</text>
    <text x="110" y="535" class="box-title-small">Stored XSSをFindingへ昇格、Boundary Pairで停止</text>
    <text x="110" y="557" class="small">2.8.12の同一原因は別検証でsecurity-property-preserved</text>

    <path d="M738 375 H778" class="line-green"/>
    <text x="758" y="360" class="micro center">design correction</text>

    <rect x="796" y="140" width="696" height="472" rx="18" class="green"/>
    <text x="822" y="174" class="label">同じCASEを現行責任境界へ写す</text>
    <line x1="848" y1="205" x2="848" y2="565" class="timeline"/>
    <circle cx="848" cy="220" r="10" class="dot-green"/>
    <text x="878" y="212" class="small">RESEARCH</text>
    <text x="878" y="235" class="box-title-small">Finder wave → Root Evaluation → single source Validation</text>
    <text x="878" y="255" class="small">ここではFindingにせず、Runtime Verification Packetを作る</text>
    <circle cx="848" cy="306" r="10" class="dot-green"/>
    <text x="878" y="298" class="small">HUMAN OS · AI LAB</text>
    <text x="878" y="321" class="box-title-small">fresh隔離環境でAI Reproduction</text>
    <text x="878" y="341" class="small">runtime observationと再実行可能なRecipeをTriage Packetへ</text>
    <circle cx="848" cy="392" r="10" class="dot-green"/>
    <text x="878" y="384" class="small">HUMAN OS · UNDERSTANDING</text>
    <text x="878" y="407" class="box-title-small">source→sink、effect、confirmed impact、scenarioを説明</text>
    <text x="878" y="427" class="small">XSSなら「どの入力を、どの画面で、何を観測するか」を明示</text>
    <circle cx="848" cy="478" r="10" class="dot-green"/>
    <text x="878" y="470" class="small">HUMAN OS · SEPARATE HUMAN LAB</text>
    <text x="878" y="493" class="box-title-small">人間が別fresh環境で同じpayloadと全stepを必ず再実行</text>
    <circle cx="848" cy="548" r="10" class="dot-green"/>
    <text x="878" y="540" class="small">HUMAN DECISION</text>
    <text x="878" y="563" class="box-title-small">Security Effectを観測した場合だけFindingへ昇格</text>

    <rect x="28" y="622" width="1464" height="1" class="divider"/>
    <text x="28" y="640" class="small">重要：Brizyはknown-caseで探索経路を実証したが、未知Targetでのprospective recallやTarget選定の優位性はまだ証明していない。</text>
  </g>
</svg>
