<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="690" viewBox="0 0 1600 690" role="img" aria-labelledby="title desc">
  <title id="title">Lifecycle States</title>
  <desc id="desc">Target、Research、Validation、Human Reviewの状態遷移。</desc>
  <defs>
    <style>
      text { font-family: Inter, "Noto Sans JP", "Segoe UI", sans-serif; fill: #172033; }
      .page-title { font-size: 48px; font-weight: 800; letter-spacing: -1.5px; }
      .subtitle { font-size: 19px; fill: #536177; }
      .eyebrow { font-size: 13px; font-weight: 800; letter-spacing: 2px; fill: #367fd3; }
      .section-no { font-size: 13px; font-weight: 900; letter-spacing: 2px; fill: #367fd3; }
      .section-title { font-size: 31px; font-weight: 800; letter-spacing: -0.5px; }
      .question { font-size: 15px; font-weight: 700; fill: #536177; }
      .box-title { font-size: 16px; font-weight: 800; }
      .box-title-small { font-size: 14px; font-weight: 800; }
      .body { font-size: 13px; fill: #5f6d83; }
      .small { font-size: 11px; fill: #68768b; }
      .micro { font-size: 10px; fill: #68768b; }
      .label { font-size: 11px; font-weight: 800; letter-spacing: 0.7px; }
      .white { fill: #ffffff; }
      .center { text-anchor: middle; }
      .right { text-anchor: end; }
      .panel { fill: #ffffff; stroke: #d9e0ea; stroke-width: 1.5; }
      .blue { fill: #edf5ff; stroke: #91bdeb; stroke-width: 1.5; }
      .purple { fill: #f4f0ff; stroke: #bcaee6; stroke-width: 1.5; }
      .green { fill: #eaf8f0; stroke: #8fc8aa; stroke-width: 1.5; }
      .amber { fill: #fff6df; stroke: #dcb66e; stroke-width: 1.5; }
      .red { fill: #fff0ee; stroke: #d99991; stroke-width: 1.5; }
      .gray { fill: #f5f7fa; stroke: #c8d0dc; stroke-width: 1.5; }
      .dark { fill: #172033; stroke: #172033; stroke-width: 1.5; }
      .dash { stroke-dasharray: 8 7; }
      .line { fill: none; stroke: #8190a6; stroke-width: 2; marker-end: url(#arrow); }
      .line-purple { fill: none; stroke: #7254c6; stroke-width: 2.5; marker-end: url(#arrow-purple); }
      .line-green { fill: none; stroke: #2f9363; stroke-width: 2.5; marker-end: url(#arrow-green); }
      .line-dash { fill: none; stroke: #9aa7b9; stroke-width: 2; stroke-dasharray: 7 6; marker-end: url(#arrow); }
      .divider { stroke: #d9e0ea; stroke-width: 1; }
      .timeline { stroke: #c8d0dc; stroke-width: 3; }
      .dot-purple { fill: #7254c6; stroke: #ffffff; stroke-width: 4; }
      .dot-green { fill: #2f9363; stroke: #ffffff; stroke-width: 4; }
    </style>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#1e2f4d" flood-opacity="0.08"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#8190a6"/>
    </marker>
    <marker id="arrow-purple" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#7254c6"/>
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#2f9363"/>
    </marker>
  </defs>
  <rect width="1600" height="690" fill="#f7f9fc"/>
  <g transform="translate(40 40)">
    <rect width="1520" height="610" rx="24" class="panel" filter="url(#shadow)"/>
    <text x="28" y="38" class="section-no">05 · LIFECYCLE STATES</text>
    <text x="28" y="78" class="section-title">いまどこで止まり、何が次の遷移を許すか</text>
    <text x="28" y="107" class="question">設計View：実行終了、Finding、Coverage、assuranceを別々に読む。</text>

    <rect x="28" y="140" width="1464" height="82" rx="14" class="gray"/>
    <text x="50" y="169" class="box-title-small">Target dispatch</text>
    <g transform="translate(250 153)">
      <rect x="0" y="0" width="120" height="42" rx="11" class="gray"/><text x="60" y="26" class="small center">observed</text>
      <path d="M120 21 H146" class="line"/>
      <rect x="156" y="0" width="140" height="42" rx="11" class="blue"/><text x="226" y="26" class="small center">human-approved</text>
      <path d="M296 21 H322" class="line"/>
      <rect x="332" y="0" width="110" height="42" rx="11" class="purple"/><text x="387" y="26" class="small center">queued</text>
      <path d="M442 21 H468" class="line"/>
      <rect x="478" y="0" width="144" height="42" rx="11" class="purple"/><text x="550" y="26" class="small center">freshness check</text>
      <path d="M622 21 H648" class="line"/>
      <rect x="658" y="0" width="130" height="42" rx="11" class="green"/><text x="723" y="26" class="small center">active</text>
      <path d="M788 21 H814" class="line"/>
      <rect x="824" y="0" width="210" height="42" rx="11" class="amber"/><text x="929" y="26" class="small center">terminal / paused / stale</text>
    </g>

    <rect x="28" y="238" width="1464" height="82" rx="14" class="gray"/>
    <text x="50" y="267" class="box-title-small">Research Campaign</text>
    <g transform="translate(250 251)">
      <rect x="0" y="0" width="120" height="42" rx="11" class="gray"/><text x="60" y="26" class="small center">prepared</text>
      <path d="M120 21 H146" class="line"/>
      <rect x="156" y="0" width="140" height="42" rx="11" class="purple"/><text x="226" y="26" class="small center">semantic wave</text>
      <path d="M296 21 H322" class="line"/>
      <rect x="332" y="0" width="150" height="42" rx="11" class="purple"/><text x="407" y="26" class="small center">root evaluated</text>
      <path d="M482 21 H508" class="line"/>
      <rect x="518" y="0" width="160" height="42" rx="11" class="purple"/><text x="598" y="26" class="small center">depth / validation</text>
      <path d="M678 21 H704" class="line"/>
      <rect x="714" y="0" width="150" height="42" rx="11" class="green"/><text x="789" y="26" class="small center">Finding refs</text>
      <text x="886" y="26" class="small center">+</text>
      <rect x="914" y="0" width="200" height="42" rx="11" class="amber"/><text x="1014" y="26" class="small center">Coverage + unresolved</text>
    </g>

    <rect x="28" y="336" width="1464" height="82" rx="14" class="gray"/>
    <text x="50" y="365" class="box-title-small">Validation</text>
    <g transform="translate(250 349)">
      <rect x="0" y="0" width="120" height="42" rx="11" class="gray"/><text x="60" y="26" class="small center">admitted</text>
      <path d="M120 21 H146" class="line"/>
      <rect x="156" y="0" width="170" height="42" rx="11" class="purple"/><text x="241" y="26" class="small center">fresh source review</text>
      <path d="M326 21 H352" class="line"/>
      <rect x="362" y="0" width="160" height="42" rx="11" class="green"/><text x="442" y="26" class="small center">source-validated</text>
      <text x="545" y="26" class="small center">/</text>
      <rect x="562" y="0" width="150" height="42" rx="11" class="amber"/><text x="637" y="26" class="small center">needs-research</text>
      <text x="735" y="26" class="small center">/</text>
      <rect x="752" y="0" width="120" height="42" rx="11" class="gray"/><text x="812" y="26" class="small center">disproven</text>
      <text x="895" y="26" class="small center">/</text>
      <rect x="912" y="0" width="170" height="42" rx="11" class="amber"/><text x="997" y="26" class="small center">validation-pending</text>
    </g>

    <rect x="28" y="434" width="1464" height="82" rx="14" class="gray"/>
    <text x="50" y="463" class="box-title-small">Finding assurance</text>
    <g transform="translate(250 447)">
      <rect x="0" y="0" width="150" height="42" rx="11" class="purple"/><text x="75" y="26" class="small center">Finding</text>
      <path d="M150 21 H176" class="line"/>
      <rect x="186" y="0" width="145" height="42" rx="11" class="purple"/><text x="258" y="26" class="small center">AI / human review</text>
      <path d="M331 21 H357" class="line"/>
      <rect x="367" y="0" width="190" height="42" rx="11" class="blue"/><text x="462" y="26" class="small center">Verification Record</text>
      <path d="M557 21 H583" class="line-green"/>
      <rect x="593" y="0" width="150" height="42" rx="11" class="green"/><text x="668" y="26" class="small center">confirmed</text>
      <text x="768" y="26" class="small center">or</text>
      <rect x="792" y="0" width="110" height="42" rx="11" class="gray"/><text x="847" y="26" class="small center">disproved</text>
      <text x="927" y="26" class="small center">or</text>
      <rect x="951" y="0" width="190" height="42" rx="11" class="amber"/><text x="1046" y="26" class="small center">inconclusive / blocked</text>
    </g>

    <rect x="28" y="538" width="348" height="46" rx="11" class="red"/>
    <text x="202" y="566" class="small center">provider failure ≠ no-finding</text>
    <rect x="392" y="538" width="348" height="46" rx="11" class="red"/>
    <text x="566" y="566" class="small center">budget exhaustion ≠ coverage-closed</text>
    <rect x="756" y="538" width="348" height="46" rx="11" class="red"/>
    <text x="930" y="566" class="small center">AI runtime failure ≠ disproved</text>
    <rect x="1120" y="538" width="372" height="46" rx="11" class="red"/>
    <text x="1306" y="566" class="small center">new version ≠ approved source replacement</text>
  </g>
</svg>
