<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="870" viewBox="0 0 1600 870" role="img" aria-labelledby="title desc">
  <title id="title">Operating Flow</title>
  <desc id="desc">一件のTargetがTarget Intelligence、Research、Human OSを通る処理フロー。</desc>
  <defs>
    <style>
      text { font-family: Inter, "Noto Sans JP", "Segoe UI", sans-serif; fill: #172033; }
      .page-title { font-size: 48px; font-weight: 800; letter-spacing: -1.5px; }
      .subtitle { font-size: 19px; fill: #536177; }
      .eyebrow { font-size: 13px; font-weight: 800; letter-spacing: 2px; fill: #367fd3; }
      .section-no { font-size: 13px; font-weight: 900; letter-spacing: 2px; fill: #367fd3; }
      .section-title { font-size: 31px; font-weight: 800; letter-spacing: -0.5px; }
      .question { font-size: 15px; font-weight: 700; fill: #536177; }
      .box-title { font-size: 16px; font-weight: 800; }
      .box-title-small { font-size: 14px; font-weight: 800; }
      .body { font-size: 13px; fill: #5f6d83; }
      .small { font-size: 11px; fill: #68768b; }
      .micro { font-size: 10px; fill: #68768b; }
      .label { font-size: 11px; font-weight: 800; letter-spacing: 0.7px; }
      .white { fill: #ffffff; }
      .center { text-anchor: middle; }
      .right { text-anchor: end; }
      .panel { fill: #ffffff; stroke: #d9e0ea; stroke-width: 1.5; }
      .blue { fill: #edf5ff; stroke: #91bdeb; stroke-width: 1.5; }
      .purple { fill: #f4f0ff; stroke: #bcaee6; stroke-width: 1.5; }
      .green { fill: #eaf8f0; stroke: #8fc8aa; stroke-width: 1.5; }
      .amber { fill: #fff6df; stroke: #dcb66e; stroke-width: 1.5; }
      .red { fill: #fff0ee; stroke: #d99991; stroke-width: 1.5; }
      .gray { fill: #f5f7fa; stroke: #c8d0dc; stroke-width: 1.5; }
      .dark { fill: #172033; stroke: #172033; stroke-width: 1.5; }
      .dash { stroke-dasharray: 8 7; }
      .line { fill: none; stroke: #8190a6; stroke-width: 2; marker-end: url(#arrow); }
      .line-purple { fill: none; stroke: #7254c6; stroke-width: 2.5; marker-end: url(#arrow-purple); }
      .line-green { fill: none; stroke: #2f9363; stroke-width: 2.5; marker-end: url(#arrow-green); }
      .line-dash { fill: none; stroke: #9aa7b9; stroke-width: 2; stroke-dasharray: 7 6; marker-end: url(#arrow); }
      .divider { stroke: #d9e0ea; stroke-width: 1; }
      .timeline { stroke: #c8d0dc; stroke-width: 3; }
      .dot-purple { fill: #7254c6; stroke: #ffffff; stroke-width: 4; }
      .dot-green { fill: #2f9363; stroke: #ffffff; stroke-width: 4; }
    </style>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#1e2f4d" flood-opacity="0.08"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#8190a6"/>
    </marker>
    <marker id="arrow-purple" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#7254c6"/>
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#2f9363"/>
    </marker>
  </defs>
  <rect width="1600" height="870" fill="#f7f9fc"/>
  <g transform="translate(40 40)">
    <rect width="1520" height="790" rx="24" class="panel" filter="url(#shadow)"/>
    <text x="28" y="38" class="section-no">02 · OPERATING ACTIVITY</text>
    <text x="28" y="78" class="section-title">一件のTargetは、どの分岐と人間gateを通るか</text>
    <text x="28" y="107" class="question">上から下へ進む。別TargetのCampaignを約5件並行できるが、一件の責任境界は変わらない。</text>

    <rect x="28" y="140" width="456" height="610" rx="18" class="blue"/>
    <text x="52" y="172" class="label">TARGET INTELLIGENCE · 選ぶ</text>
    <rect x="52" y="194" width="408" height="92" rx="13" class="panel"/>
    <text x="74" y="222" class="box-title">1 · Observe &amp; rank</text>
    <text x="74" y="246" class="body">programme、version、履歴を取得し、oracle-freeな</text>
    <text x="74" y="266" class="body">事実で多数のTarget候補をrankする。</text>
    <path d="M256 286 V310" class="line"/>
    <rect x="52" y="320" width="408" height="92" rx="13" class="panel"/>
    <text x="74" y="348" class="box-title">2 · Human batch approval</text>
    <text x="74" y="372" class="body">理由、欠損、重複、versionをまとめて確認。</text>
    <text x="74" y="392" class="label" fill="#315d93">人間が approve / exclude / reorder</text>
    <path d="M256 412 V436" class="line"/>
    <rect x="52" y="446" width="408" height="92" rx="13" class="panel"/>
    <text x="74" y="474" class="box-title">3 · Freshness &amp; dispatch</text>
    <text x="74" y="498" class="body">実行直前にsource/versionを再確認。staleなら停止。</text>
    <text x="74" y="518" class="body">別Targetをdurable queueからCampaignへ送る。</text>
    <rect x="52" y="574" width="408" height="130" rx="13" class="amber"/>
    <text x="74" y="602" class="box-title">分岐</text>
    <text x="74" y="627" class="body">approved → Target Intake Packet</text>
    <text x="74" y="650" class="body">stale → re-selection / re-approval</text>
    <text x="74" y="673" class="body">excluded → 理由付きResearch History</text>

    <path d="M484 435 H514" class="line-purple"/>
    <text x="499" y="423" class="micro center">versioned handoff</text>

    <rect x="532" y="140" width="456" height="610" rx="18" class="purple"/>
    <text x="556" y="172" class="label">RESEARCH · 仮説を作る</text>
    <rect x="556" y="194" width="408" height="92" rx="13" class="panel"/>
    <text x="578" y="222" class="box-title">4 · Fix Target &amp; plan</text>
    <text x="578" y="246" class="body">Snapshot、Manifest、policy、budget、Model Profileを</text>
    <text x="578" y="266" class="body">digestで固定する。</text>
    <path d="M760 286 V310" class="line"/>
    <rect x="556" y="320" width="408" height="112" rx="13" class="panel"/>
    <text x="578" y="348" class="box-title">5 · Independent Finder wave</text>
    <text x="578" y="372" class="body">最大4つのfresh thesisがread-only sourceを追う。</text>
    <text x="578" y="394" class="body">支持数やmodel多数決でcandidateを捨てない。</text>
    <text x="578" y="414" class="small">output: Hypothesis · Route · Frontier · Gap</text>
    <path d="M760 432 V456" class="line"/>
    <rect x="556" y="466" width="408" height="112" rx="13" class="panel"/>
    <text x="578" y="494" class="box-title">6 · Root evaluation &amp; depth</text>
    <text x="578" y="518" class="body">直接impact → Validation</text>
    <text x="578" y="540" class="body">strong frontier → conditional Depth</text>
    <text x="578" y="562" class="body">material evidenceなし → 根拠付きstop</text>
    <path d="M760 578 V602" class="line"/>
    <rect x="556" y="612" width="408" height="92" rx="13" class="panel"/>
    <text x="578" y="640" class="box-title">7 · Single source Validation</text>
    <text x="578" y="664" class="body">fresh reviewが決定的な反証だけを除く。</text>
    <text x="578" y="684" class="small">output: Runtime Packet / needs-research / disproved</text>

    <path d="M988 435 H1018" class="line-purple"/>
    <text x="1003" y="423" class="micro center">versioned handoff</text>

    <rect x="1036" y="140" width="456" height="610" rx="18" class="green"/>
    <text x="1060" y="172" class="label">HUMAN OS · 成立を確認する</text>
    <rect x="1060" y="194" width="408" height="92" rx="13" class="panel"/>
    <text x="1082" y="222" class="box-title">8 · AI Reproduction</text>
    <text x="1082" y="246" class="body">fresh隔離環境で実interfaceを試し、再実行可能な</text>
    <text x="1082" y="266" class="body">RecipeとTriage Packetを作る。</text>
    <path d="M1264 286 V310" class="line"/>
    <rect x="1060" y="320" width="408" height="112" rx="13" class="panel"/>
    <text x="1082" y="348" class="box-title">9 · Understand &amp; human reproduce</text>
    <text x="1082" y="372" class="body">source→sink、effect、confirmed impact、plausible</text>
    <text x="1082" y="394" class="body">scenarioを理解し、別fresh環境で全stepを再実行。</text>
    <text x="1082" y="414" class="label" fill="#315d93">省略できない人間gate</text>
    <path d="M1264 432 V456" class="line"/>
    <rect x="1060" y="466" width="408" height="92" rx="13" class="panel"/>
    <text x="1082" y="494" class="box-title">10 · Finding gate</text>
    <text x="1082" y="518" class="body">人間がSecurity Effectを観測した場合だけ昇格。</text>
    <text x="1082" y="538" class="body">AIの成功判定だけではFindingにしない。</text>
    <path d="M1264 558 V582" class="line"/>
    <rect x="1060" y="592" width="408" height="112" rx="13" class="panel"/>
    <text x="1082" y="620" class="box-title">11 · Report, stage, submit</text>
    <text x="1082" y="644" class="body">AI draft → 人間がPoC / Descriptionを承認 →</text>
    <text x="1082" y="666" class="body">formを自動入力。最後のSubmitは人間だけ。</text>
    <text x="1082" y="688" class="label" fill="#9c6710">report / stagingは拡張中</text>
  </g>
</svg>
