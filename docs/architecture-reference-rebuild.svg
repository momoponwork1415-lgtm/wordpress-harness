<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1040" viewBox="0 0 1600 1040" role="img" aria-labelledby="title desc">
  <title id="title">Full reference-pipeline rebuild</title>
  <desc id="desc">A larger alternative that adds a Harness Operations control plane, Recon, Threat Model, coverage cells, parallel Hunt, Gapfill, Finding projection, and runtime verification.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L9,3 L0,6 Z" fill="#42526e"/></marker>
    <marker id="loop" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L9,3 L0,6 Z" fill="#7a57b5"/></marker>
    <style>
      .bg{fill:#f7f9fc}.frame{fill:#fff;stroke:#c8d1df;stroke-width:2}.context{fill:#edf3ff;stroke:#5b7cba;stroke-width:2}.kept{fill:#eef6ff;stroke:#4d78a8;stroke-width:2}.changed{fill:#fff4cc;stroke:#c59016;stroke-width:2}.new{fill:#f2eaff;stroke:#7a57b5;stroke-width:2}.human{fill:#e7f7ee;stroke:#23875f;stroke-width:2}.legacy{fill:#fff0f0;stroke:#c24f4f;stroke-width:2;stroke-dasharray:8 6}.line{fill:none;stroke:#42526e;stroke-width:2.4;marker-end:url(#arrow)}.loop{fill:none;stroke:#7a57b5;stroke-width:2.4;marker-end:url(#loop)}.dash{fill:none;stroke:#9b6670;stroke-width:2;stroke-dasharray:7 6}.title{font:700 30px Inter,Segoe UI,sans-serif;fill:#172033}.subtitle{font:16px Inter,Segoe UI,sans-serif;fill:#526078}.h{font:700 18px Inter,Segoe UI,sans-serif;fill:#172033}.label{font:700 15px Inter,Segoe UI,sans-serif;fill:#273449}.small{font:13px Inter,Segoe UI,sans-serif;fill:#526078}.tiny{font:12px Inter,Segoe UI,sans-serif;fill:#526078}.mono{font:13px ui-monospace,SFMono-Regular,Consolas,monospace;fill:#273449}
    </style>
  </defs>
  <rect class="bg" width="1600" height="1040"/>
  <text x="48" y="54" class="title">Full rebuild — adopt a reference-style campaign pipeline</text>
  <text x="48" y="83" class="subtitle">Alternative only: broader alignment, more replacement risk, and a larger evidence burden</text>

  <rect x="48" y="112" width="1504" height="782" rx="18" class="frame"/>
  <rect x="78" y="142" width="1444" height="94" rx="15" class="new"/>
  <text x="100" y="175" class="h">Harness Operations control plane</text>
  <text x="100" y="204" class="mono">launch(ApprovedBatch) · inspect(Operation) · decideSubmission(DraftRevision, Destination)</text>
  <text x="1270" y="175" text-anchor="middle" class="small">new ownership</text>
  <text x="1270" y="201" text-anchor="middle" class="small">operation identity · idempotency · progress</text>

  <rect x="78" y="266" width="240" height="560" rx="15" class="context"/>
  <text x="100" y="299" class="h">Target Intelligence</text>
  <rect x="104" y="336" width="188" height="74" rx="12" class="kept"/>
  <text x="198" y="365" text-anchor="middle" class="label">Select</text>
  <text x="198" y="389" text-anchor="middle" class="small">oracle-free facts</text>
  <path d="M198 410V446" class="line"/>
  <rect x="104" y="446" width="188" height="74" rx="12" class="human"/>
  <text x="198" y="475" text-anchor="middle" class="label">Approve batch</text>
  <text x="198" y="499" text-anchor="middle" class="small">human boundary</text>
  <path d="M198 520V556" class="line"/>
  <rect x="104" y="556" width="188" height="74" rx="12" class="changed"/>
  <text x="198" y="585" text-anchor="middle" class="label">Dispatch</text>
  <text x="198" y="609" text-anchor="middle" class="small">Operation-owned queue</text>

  <rect x="344" y="266" width="840" height="560" rx="15" class="context"/>
  <text x="366" y="299" class="h">Research — stage graph replaced</text>
  <rect x="378" y="336" width="170" height="82" rx="12" class="new"/>
  <text x="463" y="365" text-anchor="middle" class="label">Recon</text>
  <text x="463" y="389" text-anchor="middle" class="small">assets · entry points</text>
  <text x="463" y="407" text-anchor="middle" class="small">trust · unknowns</text>
  <path d="M548 377H582" class="line"/>
  <rect x="582" y="336" width="188" height="82" rx="12" class="new"/>
  <text x="676" y="365" text-anchor="middle" class="label">Threat Model</text>
  <text x="676" y="389" text-anchor="middle" class="small">synthesis + fresh review</text>
  <text x="676" y="407" text-anchor="middle" class="small">coverage plan</text>
  <path d="M770 377H804" class="line"/>
  <rect x="804" y="336" width="170" height="82" rx="12" class="new"/>
  <text x="889" y="365" text-anchor="middle" class="label">Coverage Cells</text>
  <text x="889" y="389" text-anchor="middle" class="small">area × property</text>
  <text x="889" y="407" text-anchor="middle" class="small">plus wildcard</text>
  <path d="M974 377H1008" class="line"/>
  <rect x="1008" y="336" width="142" height="82" rx="12" class="new"/>
  <text x="1079" y="365" text-anchor="middle" class="label">Parallel Hunt</text>
  <text x="1079" y="389" text-anchor="middle" class="small">fresh workers</text>
  <text x="1079" y="407" text-anchor="middle" class="small">candidate union</text>

  <path d="M1079 418V470H963" class="line"/>
  <rect x="854" y="470" width="218" height="92" rx="12" class="changed"/>
  <text x="963" y="501" text-anchor="middle" class="label">Independent Validation</text>
  <text x="963" y="525" text-anchor="middle" class="small">fresh source review</text>
  <text x="963" y="547" text-anchor="middle" class="small">Finding projection</text>
  <path d="M854 516H816" class="line"/>
  <rect x="618" y="470" width="198" height="92" rx="12" class="changed"/>
  <text x="717" y="501" text-anchor="middle" class="label">Finding</text>
  <text x="717" y="526" text-anchor="middle" class="mono">source-validated</text>
  <text x="717" y="548" text-anchor="middle" class="small">coverage-independent</text>

  <rect x="378" y="470" width="190" height="92" rx="12" class="new"/>
  <text x="473" y="501" text-anchor="middle" class="label">Coverage Review</text>
  <text x="473" y="525" text-anchor="middle" class="small">closed · incomplete</text>
  <text x="473" y="547" text-anchor="middle" class="small">material gaps</text>
  <path d="M473 470V446H1079V470" class="loop"/>
  <text x="777" y="440" text-anchor="middle" class="tiny">Gapfill loop: open cell → new Hunt</text>

  <rect x="378" y="630" width="772" height="130" rx="12" class="legacy"/>
  <text x="764" y="664" text-anchor="middle" class="label">Current research implementation displaced</text>
  <text x="764" y="691" text-anchor="middle" class="small">Semantic Wave · Approach Family · conditional Depth · existing Root Evaluation</text>
  <text x="764" y="717" text-anchor="middle" class="small">new artifact families: Operation · Recon · Threat Model · Coverage Cell · Gapfill</text>
  <text x="764" y="743" text-anchor="middle" class="small">requires new replay, migration, behavior tests, and recall comparison</text>

  <rect x="1210" y="266" width="282" height="560" rx="15" class="context"/>
  <text x="1232" y="299" class="h">Human OS</text>
  <rect x="1236" y="336" width="230" height="82" rx="12" class="changed"/>
  <text x="1351" y="365" text-anchor="middle" class="label">Runtime verification</text>
  <text x="1351" y="389" text-anchor="middle" class="small">fresh AI environment</text>
  <text x="1351" y="407" text-anchor="middle" class="small">Verification Record</text>
  <path d="M1351 418V456" class="line"/>
  <rect x="1236" y="456" width="230" height="82" rx="12" class="changed"/>
  <text x="1351" y="485" text-anchor="middle" class="label">Human verification</text>
  <text x="1351" y="509" text-anchor="middle" class="small">optional assurance</text>
  <text x="1351" y="527" text-anchor="middle" class="small">append-only</text>
  <path d="M1351 538V576" class="line"/>
  <rect x="1236" y="576" width="230" height="82" rx="12" class="new"/>
  <text x="1351" y="605" text-anchor="middle" class="label">Draft + approval task</text>
  <text x="1351" y="629" text-anchor="middle" class="small">projected in Operation</text>
  <text x="1351" y="647" text-anchor="middle" class="small">exact revision</text>
  <path d="M1351 658V696" class="line"/>
  <rect x="1236" y="696" width="230" height="82" rx="12" class="human"/>
  <text x="1351" y="725" text-anchor="middle" class="label">External action gate</text>
  <text x="1351" y="749" text-anchor="middle" class="small">human authorization</text>
  <text x="1351" y="767" text-anchor="middle" class="small">staging / submit</text>

  <path d="M292 593H344" class="line"/>
  <path d="M816 516H1209" class="line"/>

  <rect x="48" y="920" width="1504" height="82" rx="14" class="frame"/>
  <rect x="74" y="944" width="18" height="18" rx="4" class="kept"/><text x="102" y="958" class="small">existing retained</text>
  <rect x="292" y="944" width="18" height="18" rx="4" class="changed"/><text x="320" y="958" class="small">contract changed</text>
  <rect x="522" y="944" width="18" height="18" rx="4" class="new"/><text x="550" y="958" class="small">new module/artifact family</text>
  <rect x="820" y="944" width="18" height="18" rx="4" class="legacy"/><text x="848" y="958" class="small">current path displaced</text>
  <rect x="1100" y="944" width="18" height="18" rx="4" class="human"/><text x="1128" y="958" class="small">human authorization boundary</text>
  <text x="74" y="985" class="tiny">Use only if a pilot shows the current research strategy or public seams are the bottleneck; reference similarity alone is insufficient evidence.</text>
</svg>
