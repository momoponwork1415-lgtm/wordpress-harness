<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="390" height="1500" viewBox="0 0 390 1500" role="img" aria-labelledby="title desc" style="width:100%;max-width:390px;height:auto">
  <title id="title">WordPress Harness 診断コア</title>
  <desc id="desc">Target sourceをAIが自由に探索し、候補を別のAIが独立検証する縦一列のモバイル向けアーキテクチャ図。Finding、反証、未完了をHarnessが記録し、隔離は実行Adapter内部の安全条件として扱う。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="1" stop-color="#101827"/>
    </linearGradient>
    <linearGradient id="discovery" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#123f38"/>
      <stop offset="1" stop-color="#102d31"/>
    </linearGradient>
    <linearGradient id="validation" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#33265c"/>
      <stop offset="1" stop-color="#211f45"/>
    </linearGradient>
    <filter id="shadow" x="-15%" y="-15%" width="130%" height="140%">
      <feDropShadow dx="0" dy="7" stdDeviation="8" flood-color="#000" flood-opacity="0.28"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#78aaff"/>
    </marker>
    <style>
      .sans{font-family:Inter,"Noto Sans JP",system-ui,-apple-system,"Segoe UI",sans-serif}
      .mono{font-family:"SFMono-Regular",Consolas,monospace}
      .title{fill:#f7f9fc;font-size:30px;font-weight:760;letter-spacing:-.8px}
      .subtitle{fill:#a9b9ce;font-size:15px}
      .eyebrow{font-size:11px;font-weight:760;letter-spacing:1.1px}
      .cardTitle{fill:#f7f9fc;font-size:20px;font-weight:730}
      .body{fill:#c8d4e3;font-size:14px}
      .small{fill:#a6b5c8;font-size:12px}
      .tiny{fill:#91a2b8;font-size:11px}
      .outline{fill:#111d30;stroke:#36516f;stroke-width:1.3}
      .flow{fill:none;stroke:#78aaff;stroke-width:2.4;marker-end:url(#arrow)}
    </style>
  </defs>

  <rect width="390" height="1500" fill="url(#bg)"/>
  <circle cx="345" cy="45" r="105" fill="#17345c" opacity=".34"/>
  <circle cx="34" cy="1415" r="120" fill="#123f38" opacity=".18"/>

  <g class="sans">
    <text x="24" y="42" class="mono eyebrow" fill="#78aaff">CURRENT DESIGN · MOBILE</text>
    <text x="24" y="79" class="title">診断コア</text>
    <text x="24" y="107" class="subtitle">発見して、別のAIが検証する。</text>
    <rect x="24" y="124" width="342" height="34" rx="17" fill="#142d4a" stroke="#315b8d"/>
    <circle cx="43" cy="141" r="5" fill="#78aaff"/>
    <text x="56" y="146" class="small">成功条件 = oracleなしの発見 + 独立Validation</text>

    <g filter="url(#shadow)">
      <rect x="24" y="190" width="342" height="102" rx="18" class="outline"/>
      <text x="46" y="220" class="mono eyebrow" fill="#78aaff">INPUT</text>
      <text x="46" y="250" class="cardTitle">Target Snapshot</text>
      <text x="46" y="274" class="body">WordPress pluginのraw source</text>
    </g>

    <path d="M195 294V326" class="flow"/>

    <g filter="url(#shadow)">
      <rect x="24" y="330" width="342" height="238" rx="20" fill="url(#discovery)" stroke="#328669" stroke-width="1.5"/>
      <rect x="44" y="350" width="77" height="25" rx="12" fill="#1e5a45"/>
      <text x="58" y="367" class="mono tiny" fill="#b8f2d4">AI OWNS</text>
      <text x="44" y="408" class="cardTitle">1. Discovery</text>
      <text x="44" y="438" class="body">Root agentがsource全体を調査</text>
      <text x="44" y="465" class="body">読む順序・仮説・subagentを自由に判断</text>
      <text x="44" y="492" class="body">怪しいrouteがあれば継続</text>
      <text x="44" y="519" class="body">有望な次手がなければ停止</text>
      <text x="44" y="548" class="small">固定Depth / Wave / CWE checklistなし</text>
    </g>

    <path d="M195 570V602" class="flow"/>

    <g filter="url(#shadow)">
      <rect x="44" y="606" width="302" height="76" rx="17" fill="#112d28" stroke="#328669"/>
      <text x="64" y="636" class="mono eyebrow" fill="#68d8a2">OUTPUT</text>
      <text x="64" y="655" class="body">具体的な主張 + attacker premise</text>
      <text x="64" y="675" class="small">source evidence</text>
    </g>

    <path d="M195 684V716" class="flow"/>

    <g filter="url(#shadow)">
      <rect x="24" y="720" width="342" height="218" rx="20" fill="url(#validation)" stroke="#816bd1" stroke-width="1.5"/>
      <rect x="44" y="740" width="77" height="25" rx="12" fill="#4a367e"/>
      <text x="58" y="757" class="mono tiny" fill="#ded6ff">AI OWNS</text>
      <text x="44" y="798" class="cardTitle">2. Independent Validation</text>
      <text x="44" y="828" class="body">最大4候補を別contextで並列検証</text>
      <text x="44" y="855" class="body">Discoveryの結論を信用しない</text>
      <text x="44" y="882" class="body">到達性・防御・impact・反証を確認</text>
      <text x="44" y="916" class="small">各Validatorは独立 · RCEへの昇格は不要</text>
    </g>

    <path d="M195 940V972" class="flow"/>

    <g filter="url(#shadow)">
      <rect x="24" y="976" width="342" height="180" rx="20" class="outline"/>
      <text x="44" y="1007" class="mono eyebrow" fill="#78aaff">RESULT</text>
      <rect x="44" y="1024" width="302" height="34" rx="10" fill="#153b30"/>
      <circle cx="61" cy="1041" r="5" fill="#68d8a2"/>
      <text x="75" y="1046" class="body">Finding — 独立に支持できた</text>
      <rect x="44" y="1067" width="302" height="34" rx="10" fill="#2b2b3e"/>
      <circle cx="61" cy="1084" r="5" fill="#b39aff"/>
      <text x="75" y="1089" class="body">Disproved — 必要条件を反証</text>
      <rect x="44" y="1110" width="302" height="34" rx="10" fill="#302a25"/>
      <circle cx="61" cy="1127" r="5" fill="#e6aa68"/>
      <text x="75" y="1132" class="body">Incomplete — 外部制約で未決</text>
    </g>

    <path d="M195 1158V1190" class="flow"/>

    <g filter="url(#shadow)">
      <rect x="24" y="1194" width="342" height="126" rx="20" fill="#13243a" stroke="#3d6590" stroke-width="1.4"/>
      <text x="44" y="1225" class="mono eyebrow" fill="#78aaff">HARNESS RECORDS</text>
      <text x="44" y="1254" class="body">Target / Prompt · Checkpoint · Usage / Failure</text>
      <text x="44" y="1281" class="body">Candidate · Validation result · Finding</text>
      <text x="44" y="1305" class="small">判断手順は記録schemaで縛らない</text>
    </g>

    <g>
      <rect x="24" y="1348" width="342" height="54" rx="16" fill="#151e2d" stroke="#35465c"/>
      <text x="44" y="1372" class="small">Native Agent Adapter: Grok / GLM 5.3</text>
      <text x="44" y="1391" class="tiny">既存gVisorは内部の安全手段。診断の目的ではない。</text>
    </g>

    <g opacity=".86">
      <text x="24" y="1434" class="mono eyebrow" fill="#91a2b8">NOT REQUIRED FOR DIAGNOSIS</text>
      <text x="24" y="1458" class="tiny">Target選定自動化 · patched/control</text>
      <text x="24" y="1477" class="tiny">Human OS · Coverage closure</text>
    </g>
  </g>
</svg>
