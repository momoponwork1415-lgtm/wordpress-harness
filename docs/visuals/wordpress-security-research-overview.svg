<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="860" viewBox="0 0 1600 860" role="img" aria-labelledby="overview-title overview-desc" style="max-width:100%;height:auto">
  <title id="overview-title">WordPress Harnessの3領域と受け渡し</title>
  <desc id="overview-desc">対象情報、探索、人間による運用の3領域について、プログラム境界を含む対象選定、条件付き3試行、人間の判断点、領域間で渡す情報を示す。</desc>
  <defs>
    <marker id="overview-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#526779"/></marker>
    <style>
      text{font-family:"Noto Sans CJK JP","Noto Sans JP",system-ui,sans-serif;fill:#172c3d}.muted{fill:#526779}.title{font-size:36px;font-weight:750}.sub{font-size:18px}.zoneTitle{font-size:22px;font-weight:750}.boxTitle{font-size:19px;font-weight:750}.body{font-size:15px}.small{font-size:13px}.tag{font-size:12px;font-weight:700}.zone{fill:rgba(23,44,61,.018);stroke:#cdd9e3;stroke-width:1}.node{fill:#fff;stroke:#8797a5;stroke-width:1}.human{fill:#fff;stroke:#8797a5;stroke-width:1.2;stroke-dasharray:6 4}.focal{fill:#e6f3ee;stroke:#227567;stroke-width:1.2}.arrow{fill:none;stroke:#526779;stroke-width:2.4;marker-end:url(#overview-arrow)}.return{stroke-dasharray:7 6}.mask{fill:#f5f7fa}
    </style>
  </defs>

  <rect width="1600" height="860" fill="#f5f7fa"/>
  <text x="48" y="48" class="small muted" font-weight="700">WORDPRESS脆弱性調査基盤 / 全体構成</text>
  <text x="48" y="97" class="title">3つの領域は、何を持ち、何を受け渡すか</text>
  <text x="48" y="133" class="sub muted">Harnessは境界と証拠を守り、AIは探索を判断し、人間は開始・候補採否・外部行動を決める。</text>

  <rect x="40" y="184" width="440" height="516" rx="8" class="zone"/>
  <rect x="580" y="184" width="440" height="516" rx="8" class="zone"/>
  <rect x="1120" y="184" width="440" height="516" rx="8" class="zone"/>
  <text x="72" y="224" class="zoneTitle">1  対象情報</text>
  <text x="612" y="224" class="zoneTitle">2  探索</text>
  <text x="1152" y="224" class="zoneTitle">3  人間による運用</text>

  <!-- Connections are drawn before nodes. -->
  <path d="M260 368V468" class="arrow"/>
  <rect x="276" y="406" width="148" height="24" rx="4" class="mask"/>
  <text x="288" y="423" class="small muted">対象・順序・安全上限</text>

  <path d="M440 518H512Q520 518 520 510V342Q520 334 528 334H620" class="arrow"/>
  <rect x="532" y="408" width="156" height="24" rx="4" class="mask"/>
  <text x="528" y="425" class="small muted">承認済み対象 + 3試行計画</text>

  <path d="M980 306H992Q1000 306 1000 298V232Q1000 224 992 224H808Q800 224 800 232V268" class="arrow return"/>
  <rect x="836" y="192" width="128" height="24" rx="4" class="mask"/>
  <text x="824" y="209" class="small muted">試行内のcontinue + 次の手</text>

  <path d="M800 398V468" class="arrow"/>
  <rect x="796" y="416" width="176" height="24" rx="4" class="mask"/>
  <text x="808" y="433" class="small muted">完了した試行群 + 候補</text>

  <path d="M980 518H1052Q1060 518 1060 510V318Q1060 310 1068 310H1160" class="arrow"/>
  <rect x="964" y="450" width="168" height="24" rx="4" class="mask"/>
  <text x="976" y="467" class="small muted">候補の動的検証依頼</text>

  <path d="M1240 360V418" class="arrow"/>
  <path d="M1320 470H1352" class="arrow"/>
  <path d="M1436 520V568" class="arrow"/>

  <!-- Target Intelligence -->
  <rect x="80" y="268" width="360" height="100" rx="8" class="node"/>
  <text x="104" y="301" class="boxTitle">観測と対象提案</text>
  <text x="104" y="330" class="body">プログラム境界・公開履歴集約・更新を整理</text>
  <text x="104" y="353" class="small muted">既知脆弱性を探索の答えとして渡さない</text>

  <rect x="80" y="468" width="360" height="100" rx="8" class="human"/>
  <text x="104" y="493" class="tag muted">人間の判断</text>
  <text x="104" y="525" class="boxTitle">探索の開始を承認</text>
  <text x="104" y="550" class="body">対象群・各対象の3試行・全体の安全上限</text>

  <!-- Research -->
  <rect x="620" y="268" width="360" height="130" rx="8" class="focal"/>
  <text x="644" y="301" class="boxTitle" fill="#227567">条件付き3試行と自律探索</text>
  <text x="644" y="330" class="body">複数対象の初回を独立並列、候補ありなら2試行追加</text>
  <text x="644" y="357" class="body">各試行は具体的な次の手があれば自動継続</text>
  <text x="644" y="382" class="small muted">後続へ初回結果を渡さず、候補だけでは停止しない</text>

  <rect x="620" y="468" width="360" height="100" rx="8" class="human"/>
  <text x="644" y="493" class="tag muted">人間の判断</text>
  <text x="644" y="525" class="boxTitle">候補の採否を決める</text>
  <text x="644" y="550" class="body">AIがstopした後だけ動的検証へ進める</text>

  <!-- Human OS -->
  <rect x="1160" y="260" width="360" height="100" rx="8" class="node"/>
  <text x="1184" y="293" class="boxTitle">新しい実環境で動的検証</text>
  <text x="1184" y="322" class="body">候補に結び付いた再現手順を一度だけ実行</text>
  <text x="1184" y="347" class="small muted">別AIに脆弱性を探し直させない</text>

  <rect x="1160" y="418" width="160" height="102" rx="8" class="focal"/>
  <text x="1184" y="451" class="boxTitle" fill="#227567">確認済み</text>
  <text x="1184" y="478" class="boxTitle" fill="#227567">脆弱性</text>
  <text x="1184" y="505" class="small muted">技術的な真偽</text>

  <rect x="1352" y="418" width="168" height="102" rx="8" class="node"/>
  <text x="1376" y="451" class="boxTitle">対象範囲</text>
  <text x="1376" y="478" class="body">全プログラム</text>
  <text x="1376" y="505" class="small muted">対象内 / 外 / 不明</text>

  <rect x="1160" y="568" width="360" height="80" rx="8" class="human"/>
  <text x="1184" y="593" class="tag muted">人間の判断</text>
  <text x="1184" y="625" class="boxTitle">提出先と文案を承認し、人間が提出</text>

  <line x1="40" y1="756" x2="1560" y2="756" stroke="#cdd9e3" stroke-width="1"/>
  <text x="48" y="790" class="small muted">凡例</text>
  <line x1="112" y1="784" x2="160" y2="784" stroke="#526779" stroke-width="2.4" marker-end="url(#overview-arrow)"/>
  <text x="176" y="790" class="small">領域間の受け渡し</text>
  <line x1="352" y1="784" x2="400" y2="784" stroke="#526779" stroke-width="2.4" stroke-dasharray="7 6" marker-end="url(#overview-arrow)"/>
  <text x="416" y="790" class="small">探索内の自動継続</text>
  <rect x="592" y="772" width="44" height="24" rx="6" class="human"/>
  <text x="652" y="790" class="small">人間が判断する処理</text>
  <rect x="840" y="772" width="44" height="24" rx="6" class="focal"/>
  <text x="900" y="790" class="small">この図で注目する処理・記録</text>
  <text x="1552" y="824" class="small muted" text-anchor="end">契約の詳細は「探索設計」と「コードベース案内」を参照</text>
</svg>
