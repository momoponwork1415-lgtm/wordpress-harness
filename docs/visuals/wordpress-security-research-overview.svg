<text x="423" y="641" font-size="15" text-anchor="middle">Coverage Receipt / 調査の進行状況</text>
<path d="M1069 589V690H760V589" class="arrow back"/>
<rect x="736" y="669" width="268" height="38" rx="0" fill="#f5f7fa" stroke="#f5f7fa"/>
<text x="870" y="693" font-size="15" text-anchor="middle">Evidence Request / 不足証拠の要求</text>
<text x="40" y="746" font-size="16" style="fill:#526678">実線：主要な受け渡し　　破線：戻りの受け渡し　　黄：人間の判断</text>
<text x="40" y="777" font-size="15" style="fill:#526678">設計上の関係図。責務と用語はContext Map、現在の接続状況はCodebase Guideを参照。</text>
