<title id="title">WordPress Harness — 誰が何を持つか</title><desc id="desc">設計上の3領域と受け渡し。Target IntelligenceからResearchへCampaign Input、ResearchからHuman OSへFindingを渡す。戻りの受け渡しはCoverage ReceiptとEvidence Request。実装の接続状況はCodebase Guideで確認する。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#53687a"/></marker>
<style>text{font-family:"Noto Sans CJK JP","Noto Sans JP",system-ui,sans-serif;fill:#172c3d}.muted{fill:#526678}.arrow{fill:none;stroke:#53687a;stroke-width:2;marker-end:url(#arrow)}.back{stroke-dasharray:6 5}</style></defs>
<rect width="1280" height="800" fill="#f5f7fa"/>
<text x="40" y="47" font-size="14" style="fill:#526678" font-weight="600">ARCHITECTURE / RESPONSIBILITIES</text>
<text x="40" y="96" font-size="36" font-weight="700">誰が何を持ち、何を渡すか</text>
<text x="40" y="134" font-size="20" style="fill:#526678">対象の準備 → 調査と独立検証 → 確認記録と提出前の判断</text>
<rect x="32" y="184" width="358" height="404" rx="16" fill="#fff" stroke="#d3dde6"/>
<rect x="32" y="184" width="358" height="88" rx="16" fill="#e8f2fa" stroke="#e8f2fa"/>
