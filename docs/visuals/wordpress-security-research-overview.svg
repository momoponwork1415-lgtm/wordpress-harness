<text x="54" y="253" font-size="18" style="fill:#236c9a">調査対象を準備する</text>
<text x="54" y="312" font-size="19">公開情報とソースを確認</text>
<text x="54" y="342" font-size="19">AIが対象を提案</text>
<text x="54" y="390" font-size="14" style="fill:#526678" font-weight="600">所有する記録</text>
<text x="54" y="420" font-size="17">観測・候補集合・提案</text>
<text x="54" y="447" font-size="17">人間が承認した対象集合</text>
<rect x="48" y="471" width="326" height="97" rx="10" fill="#fff5df" stroke="#e8c987"/>
<text x="64" y="498" font-size="14" style="fill:#7c571d" font-weight="700">人間の判断</text>
<text x="64" y="524" font-size="16">対象・順序・予算を承認</text>
<rect x="461" y="184" width="358" height="404" rx="16" fill="#fff" stroke="#d3dde6"/>
<rect x="461" y="184" width="358" height="88" rx="16" fill="#e6f3ee" stroke="#e6f3ee"/>
<text x="483" y="222" font-size="25" style="fill:#227567" font-weight="700">Research</text>
<text x="483" y="253" font-size="18" style="fill:#227567">主張を独立に確かめる</text>
<text x="483" y="312" font-size="19">ソースの調査と候補の記録</text>
<text x="483" y="342" font-size="19">独立検証からFindingを生成</text>
<text x="483" y="390" font-size="14" style="fill:#526678" font-weight="600">所有する記録</text>
<text x="483" y="420" font-size="17">Campaign・Finding・Coverage</text>
<text x="483" y="447" font-size="17">再開用の記録・実行結果</text>
<rect x="477" y="471" width="326" height="97" rx="10" fill="#fff5df" stroke="#e8c987"/>
<text x="493" y="498" font-size="14" style="fill:#7c571d" font-weight="700">人間の判断</text>
<text x="493" y="524" font-size="16">調査の継続を判断</text>
<text x="493" y="549" font-size="16">候補を独立検証へ進める</text>
<rect x="890" y="184" width="358" height="404" rx="16" fill="#fff" stroke="#d3dde6"/>
<rect x="890" y="184" width="358" height="88" rx="16" fill="#f0eafa" stroke="#f0eafa"/>
<text x="912" y="222" font-size="25" style="fill:#7551a4" font-weight="700">Human OS</text>
<text x="912" y="253" font-size="18" style="fill:#7551a4">確認結果と許可を残す</text>
<text x="912" y="312" font-size="19">実環境と人間による確認</text>
<text x="912" y="342" font-size="19">報告書と外部行動の承認</text>
<text x="912" y="390" font-size="14" style="fill:#526678" font-weight="600">所有する記録</text>
<text x="912" y="420" font-size="17">検証記録・非公開証拠</text>
<text x="912" y="447" font-size="17">報告書の各版・承認</text>
<rect x="906" y="471" width="326" height="97" rx="10" fill="#fff5df" stroke="#e8c987"/>
<text x="922" y="498" font-size="14" style="fill:#7c571d" font-weight="700">人間の判断</text>
<text x="922" y="524" font-size="16">別の環境で確認</text>
<text x="922" y="549" font-size="16">報告書・提出先を承認し提出</text>
