<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1040" viewBox="0 0 1600 1040" role="img" aria-labelledby="title desc" style="max-width:100%;height:auto">
  <title id="title">WordPress Harness — 一件のCandidateが提出候補になるまで</title>
  <desc id="desc">PCブラウザ向けの横長ライフサイクル図。自律Research loop、Candidate admission、fresh dynamic verification、技術的なVerified Vulnerability、programme別scope、提出承認を示す。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#526779"/></marker>
    <style>
      text{font-family:"Noto Sans CJK JP","Noto Sans JP",system-ui,sans-serif;fill:#172c3d}.muted{fill:#526779}.title{font-size:36px;font-weight:750}.sub{font-size:18px}.lane{font-size:18px;font-weight:750}.boxTitle{font-size:19px;font-weight:750}.body{font-size:15px}.small{font-size:13px}.arrow{fill:none;stroke:#526779;stroke-width:3;marker-end:url(#arrow)}.back{stroke-dasharray:8 7}.gate{fill:#fff5df;stroke:#e4c57e}.normal{fill:#fff;stroke:#cdd9e3}.ok{fill:#e6f3ee;stroke:#82b5a6}.scope{fill:#e8f2fa;stroke:#91b9d2}
    </style>
  </defs>
  <rect width="1600" height="1040" fill="#f5f7fa"/>
  <text x="48" y="52" class="small muted" font-weight="700">ONE-CANDIDATE LIFECYCLE / HUMAN DECISIONS</text>
  <text x="48" y="101" class="title">一件のCandidateは、どう検証され、どこへ提出できる状態になるか</text>
  <text x="48" y="138" class="sub muted">黄色は人間の判断。緑は技術的な確認、青はprogrammeごとの適格性で、二つを混ぜない。</text>

  <rect x="40" y="176" width="1520" height="218" rx="18" fill="#eef7f3" stroke="#c6ddd5"/>
  <text x="64" y="210" class="lane" fill="#227567">RESEARCH — sourceを理解しCandidateと検証手順を作る</text>
  <rect x="76" y="240" width="270" height="105" rx="12" class="normal"/>
  <text x="96" y="273" class="boxTitle">Research Native Run</text>
  <text x="96" y="302" class="body">Root + native subagents</text>
  <text x="96" y="327" class="body muted">Campaign safety envelope内</text>
  <path d="M346 292H405" class="arrow"/>
  <rect x="414" y="240" width="292" height="105" rx="12" class="normal"/>
  <text x="434" y="273" class="boxTitle">AI Continuation Decision</text>
  <text x="434" y="302" class="body">continue / stop</text>
  <text x="434" y="327" class="body muted">continueは同じCheckpoint</text>
  <path d="M560 240V218H210V235" class="arrow back"/>
  <path d="M706 292H765" class="arrow"/>
  <rect x="774" y="240" width="282" height="105" rx="12" class="normal"/>
  <text x="794" y="273" class="boxTitle">Research Candidate</text>
  <text x="794" y="302" class="body">claim + source evidence</text>
  <text x="794" y="327" class="body">+ private recipe ref</text>
  <path d="M1056 292H1115" class="arrow"/>
  <rect x="1124" y="240" width="342" height="105" rx="12" class="gate"/>
  <text x="1144" y="273" class="boxTitle">Human Candidate Review</text>
  <text x="1144" y="302" class="body">admit / concrete next actionで戻す</text>
  <text x="1144" y="327" class="body muted">programme scopeは先取りしない</text>
  <path d="M1295 240V218H915V235" class="arrow back"/>

  <path d="M1295 345V438" class="arrow"/>
  <text x="1313" y="411" class="body muted">admitted Candidateだけ</text>
  <rect x="1056" y="446" width="478" height="86" rx="12" class="normal"/>
  <text x="1080" y="479" class="boxTitle">Candidate Verification Request</text>
  <text x="1080" y="507" class="body">Candidate + fixed source + digest-bound private recipe</text>
  <rect x="76" y="446" width="426" height="86" rx="12" fill="#eaf0f6" stroke="#cdd9e3"/>
  <text x="98" y="478" class="boxTitle">recipeがない場合</text>
  <text x="98" y="507" class="body">verification-preparation-needed（棄却しない）</text>

  <rect x="40" y="572" width="1520" height="328" rx="18" fill="#f7f4fb" stroke="#d8cae8"/>
  <text x="64" y="607" class="lane" fill="#7551a4">HUMAN OS — fresh runtimeで実効性を確認し、その後にscopeを評価する</text>
  <path d="M1295 532V648H1060" class="arrow"/>
  <rect x="760" y="635" width="300" height="104" rx="12" class="normal"/>
  <text x="780" y="668" class="boxTitle">Dynamic Verification</text>
  <text x="780" y="697" class="body">fresh disposable WordPress</text>
  <text x="780" y="722" class="body muted">recipeを一度だけ実行</text>
  <path d="M760 687H690" class="arrow"/>
  <rect x="394" y="635" width="296" height="104" rx="12" class="ok"/>
  <text x="414" y="668" class="boxTitle" fill="#227567">Verified Vulnerability</text>
  <text x="414" y="697" class="body">runtime-confirmedのみ</text>
  <text x="414" y="722" class="body muted">技術的な真偽の記録</text>
  <path d="M394 687H326" class="arrow"/>
  <rect x="76" y="635" width="250" height="104" rx="12" fill="#eaf0f6" stroke="#cdd9e3"/>
  <text x="96" y="668" class="boxTitle">その他の結果</text>
  <text x="96" y="697" class="body">contradicted / incomplete</text>
  <text x="96" y="722" class="small muted">不足を反証へ丸めない</text>

  <path d="M542 739V788H704" class="arrow"/>
  <rect x="712" y="772" width="354" height="96" rx="12" class="scope"/>
  <text x="732" y="805" class="boxTitle" fill="#236c9a">Programme Scope Assessments</text>
  <text x="732" y="834" class="body">configured programmeをすべて評価</text>
  <text x="732" y="857" class="small muted">in / out / ambiguous / stale</text>
  <path d="M1066 820H1124" class="arrow"/>
  <rect x="1132" y="772" width="334" height="96" rx="12" class="normal"/>
  <text x="1152" y="805" class="boxTitle">Submission Candidate</text>
  <text x="1152" y="834" class="body">in-scopeのdestinationだけ</text>
  <text x="1152" y="857" class="small muted">OOSでもVerified Vulnerabilityは残る</text>

  <path d="M1299 868V925" class="arrow"/>
  <rect x="985" y="932" width="575" height="72" rx="12" class="gate"/>
  <text x="1009" y="963" class="boxTitle">Human External Action Gate</text>
  <text x="1009" y="990" class="body">一つのdestination + exact Draftを承認。最後のSubmitも人間。</text>
  <text x="48" y="1005" class="small muted">Research Coverageはこの流れと独立。Candidate件数やVerification結果を「安全性の証明」に使わない。</text>
</svg>
