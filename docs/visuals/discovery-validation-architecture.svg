<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1080" viewBox="0 0 1280 1080" role="img" aria-labelledby="title desc" style="max-width:100%;height:auto">
<title id="title">WordPress Harness — 一件の処理順と人間の判断点</title><desc id="desc">継続提案と候補がある代表経路。調査の継続と候補の独立検証には別の人間判断がある。独立検証の結果はFinding、追加調査、反証、判断保留に分かれる。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#53687a"/></marker>
<style>text{font-family:"Noto Sans CJK JP","Noto Sans JP",system-ui,sans-serif;fill:#172c3d}.muted{fill:#526678}.arrow{fill:none;stroke:#53687a;stroke-width:2;marker-end:url(#arrow)}.back{stroke-dasharray:6 5}</style></defs>
<rect width="1280" height="1080" fill="#f5f7fa"/>
<text x="40" y="47" font-size="14" style="fill:#526678" font-weight="600">LIFECYCLE / HUMAN DECISIONS</text>
<text x="40" y="93" font-size="36" font-weight="700">どこで人間が判断するか</text>
<text x="40" y="131" font-size="19" style="fill:#526678">継続提案と候補がある一件の代表経路。黄色の箱で人間が判断する。</text>
<text x="635" y="179" font-size="17" text-anchor="middle">人間が承認した対象 → 実行前の入力検査</text>
<path d="M635 188V209" class="arrow"/>
<rect x="375" y="215" width="520" height="78" rx="12" fill="#fff" stroke="#d3dde6"/>
<text x="399" y="246" font-size="21" font-weight="700">Research Grant</text>
<text x="399" y="274" font-size="16" style="fill:#526678">ソースの調査を一回実行する（最大1時間）</text>
<path d="M635 294V329" class="arrow"/>
<text x="650" y="318" font-size="14" style="fill:#526678">AIが継続を提案</text>
<rect x="375" y="335" width="520" height="78" rx="12" fill="#fff5df" stroke="#e8c987"/>
<text x="399" y="366" font-size="21" font-weight="700">Human Research Continuation Review</text>
<text x="399" y="394" font-size="16" style="fill:#526678">次の調査を承認するか、候補審査へ移るか</text>
<path d="M895 374H1070V254H900" class="arrow back"/>
<text x="1087" y="303" font-size="15" style="fill:#7c571d">継続を承認</text>
<text x="1087" y="328" font-size="14" style="fill:#526678">同じCheckpoint</text>
<path d="M635 414V454" class="arrow"/>
<text x="650" y="439" font-size="14" style="fill:#526678">候補があり、審査へ進む</text>
<rect x="375" y="460" width="520" height="78" rx="12" fill="#fff5df" stroke="#e8c987"/>
<text x="399" y="491" font-size="21" font-weight="700">Human Candidate Review</text>
<text x="399" y="519" font-size="16" style="fill:#526678">候補ごとに独立検証へ進めるか判断する</text>
<path d="M375 499H287V254H370" class="arrow back"/>
<text x="267" y="371" font-size="16" style="fill:#7c571d" font-weight="600" text-anchor="end">調査へ戻す</text>
<text x="267" y="397" font-size="14" style="fill:#526678" text-anchor="end">Validationより先に戻る</text>
<path d="M635 539V579" class="arrow"/>
<text x="650" y="565" font-size="14" style="fill:#526678">人間が選んだ候補だけ</text>
<rect x="375" y="585" width="520" height="78" rx="12" fill="#fff" stroke="#d3dde6"/>
<text x="399" y="616" font-size="21" font-weight="700">Independent Validation</text>
<text x="399" y="644" font-size="16" style="fill:#526678">新しい実行環境で、同じソースから独立に検証</text>
<path d="M635 664V720" class="arrow"/>
<text x="650" y="698" font-size="15" style="fill:#227567">source-validated</text>
<rect x="465" y="726" width="340" height="66" rx="12" fill="#e6f3ee" stroke="#82b5a6"/>
<text x="635" y="768" font-size="24" style="fill:#227567" font-weight="700" text-anchor="middle">Finding</text>
<path d="M635 793V833" class="arrow"/>
<rect x="375" y="840" width="520" height="78" rx="12" fill="#fff" stroke="#d3dde6"/>
<text x="399" y="871" font-size="21" font-weight="700">Human OS</text>
<text x="399" y="899" font-size="16" style="fill:#526678">AIと人間が別の環境で確認し、結果を追記</text>
<path d="M635 919V950" class="arrow"/>
<rect x="375" y="956" width="520" height="60" rx="12" fill="#fff5df" stroke="#e8c987"/>
<text x="635" y="993" font-size="19" style="fill:#7c571d" font-weight="600" text-anchor="middle">人間が報告書・提出先を承認し、最後に提出</text>
<rect x="928" y="586" width="318" height="164" rx="12" fill="#eaf0f6" stroke="#d3dde6"/>
<text x="948" y="618" font-size="17" font-weight="700">検証のその他の結果</text>
<text x="948" y="652" font-size="15">needs-research → 追加調査</text>
<text x="948" y="682" font-size="15">disproven → 反証を記録</text>
<text x="948" y="712" font-size="15">validation-pending → 判断保留</text>
<path d="M895 624H924" class="arrow"/>
<rect x="32" y="465" width="237" height="135" rx="12" fill="#eaf0f6" stroke="#d3dde6"/>
<text x="49" y="494" font-size="16" font-weight="700">独立検証へ進めない記録</text>
<text x="49" y="525" font-size="15">制度の対象外・範囲不明</text>
<text x="49" y="552" font-size="15">Parked Programme Lead</text>
<text x="49" y="578" font-size="15" style="fill:#526678">それぞれの状態で残す</text>
<text x="40" y="1057" font-size="15" style="fill:#526678">候補なしの終了、失敗からの再開、検証の再試行条件はCodebase Guideを参照。</text>
</svg>
