<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc" style="width:100%;max-width:1600px;height:auto;text-rendering:optimizeLegibility">
  <title id="title">WordPress Harness 全体アーキテクチャ</title>
  <desc id="desc">PCブラウザ向けの横長図。Update Frontierを含むTarget Intelligence、Research、Human OSを左から右へつなぎ、AI、Harness、人間の責務とversioned handoffを示す。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#06101d"/><stop offset="1" stop-color="#111827"/></linearGradient>
    <linearGradient id="target" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#173653"/><stop offset="1" stop-color="#10263d"/></linearGradient>
    <linearGradient id="research" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#123f38"/><stop offset="1" stop-color="#102b31"/></linearGradient>
    <linearGradient id="human" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#37285e"/><stop offset="1" stop-color="#211f45"/></linearGradient>
    <filter id="shadow" x="-15%" y="-15%" width="130%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#000" flood-opacity=".28"/></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#78aaff"/></marker>
    <style>
      .sans{font-family:Inter,"Noto Sans JP",system-ui,-apple-system,"Segoe UI",sans-serif}.mono{font-family:"SFMono-Regular",Consolas,monospace}
      .title{fill:#f7f9fc;font-size:42px;font-weight:780;letter-spacing:-1px}.subtitle{fill:#adbbce;font-size:19px}
      .section{fill:#f7f9fc;font-size:27px;font-weight:760}.card{fill:#f7f9fc;font-size:19px;font-weight:720}.body{fill:#c8d4e3;font-size:16px}.small{fill:#a9b7c9;font-size:14px}.tiny{fill:#9aaac0;font-size:13px}.eyebrow{font-size:13px;font-weight:780;letter-spacing:1.2px}
      .flow{fill:none;stroke:#78aaff;stroke-width:3;marker-end:url(#arrow)}.divider{stroke:#fff;stroke-opacity:.12;stroke-width:1}
    </style>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/><circle cx="1490" cy="20" r="270" fill="#17345c" opacity=".25"/><circle cx="20" cy="880" r="220" fill="#123f38" opacity=".17"/>
  <g class="sans">
    <text x="48" y="46" class="mono eyebrow" fill="#78aaff">WHOLE SYSTEM · DESKTOP 1600</text>
    <text x="48" y="96" class="title">全体アーキテクチャ</text>
    <text x="48" y="132" class="subtitle">更新監視からTarget選定、独立検証、fresh runtime verification、人間の提出判断まで。</text>

    <rect x="48" y="158" width="1504" height="52" rx="26" fill="#13243a" stroke="#365d86"/>
    <circle cx="76" cy="184" r="6" fill="#68d8a2"/><text x="94" y="190" class="small">AI：Target提案・探索・反証・技術的Validation</text>
    <circle cx="604" cy="184" r="6" fill="#78aaff"/><text x="622" y="190" class="small">Harness：authority・evidence・isolation・limits</text>
    <circle cx="1085" cy="184" r="6" fill="#f0bd78"/><text x="1103" y="190" class="small">Human：承認・継続・admission・外部行動</text>

    <g filter="url(#shadow)">
      <rect x="48" y="246" width="420" height="514" rx="24" fill="url(#target)" stroke="#47749c" stroke-width="1.5"/>
      <rect x="72" y="270" width="112" height="28" rx="14" fill="#244d70"/><text x="88" y="289" class="mono tiny" fill="#cce6ff">CONTEXT 1</text>
      <text x="72" y="338" class="section">Target Intelligence</text><text x="72" y="370" class="body">oracle-freeなfactから「次に読むTarget」を作る</text>
      <rect x="72" y="400" width="372" height="68" rx="14" fill="#183451" stroke="#416c94"/>
      <text x="94" y="429" class="card">Observe ecosystem + acquire source</text><text x="94" y="453" class="small">identity · version · provenance · freshness</text>
      <rect x="72" y="482" width="372" height="82" rx="14" fill="#183451" stroke="#416c94"/>
      <text x="94" y="512" class="card">Update Frontier → Candidate Pool</text><text x="94" y="536" class="small">bounded SVN window · exact versionを再取得</text><text x="94" y="556" class="tiny">exact path / source / advisoryはprivate</text>
      <rect x="72" y="578" width="372" height="68" rx="14" fill="#183451" stroke="#416c94"/>
      <text x="94" y="607" class="card">AI Target Proposal</text><text x="94" y="631" class="small">固定rank / vulnerability oracleなし</text>
      <rect x="72" y="660" width="372" height="74" rx="14" fill="#3d3526" stroke="#9b7545"/>
      <text x="94" y="690" class="card">Human Approved Batch + admission</text><text x="94" y="715" class="small">対象・Budgetを承認し、fresh sourceを再確認</text>
    </g>

    <path d="M470 505H526" class="flow"/><rect x="476" y="468" width="44" height="25" rx="12" fill="#142d4a"/><text x="498" y="485" text-anchor="middle" class="tiny">INPUT</text>

    <g filter="url(#shadow)">
      <rect x="532" y="226" width="536" height="554" rx="24" fill="url(#research)" stroke="#328669" stroke-width="1.5"/>
      <rect x="556" y="250" width="112" height="28" rx="14" fill="#1f5a45"/><text x="572" y="269" class="mono tiny" fill="#b8f2d4">CONTEXT 2</text>
      <text x="556" y="318" class="section">Research</text><text x="556" y="350" class="body">一Targetの連続Campaign。AIが仮説・読む順序・subagentを決める</text>
      <rect x="556" y="380" width="488" height="74" rx="14" fill="#163b35" stroke="#2e7a5c"/>
      <text x="580" y="411" class="card">1. Agent-led Research Grant</text><text x="580" y="436" class="small">raw source · 最大1時間 · Root込み最大4 active agents</text>
      <rect x="556" y="470" width="236" height="86" rx="14" fill="#3d3526" stroke="#9b7545"/>
      <text x="580" y="501" class="card">Human Research Review</text><text x="580" y="526" class="small">continue / proceed</text><text x="580" y="547" class="tiny">exact run + Checkpointへbind</text>
      <rect x="808" y="470" width="236" height="86" rx="14" fill="#3d3526" stroke="#9b7545"/>
      <text x="832" y="501" class="card">Human Candidate Review</text><text x="832" y="526" class="small">advance / return / hold</text><text x="832" y="547" class="tiny">exact Candidate setへbind</text>
      <rect x="556" y="572" width="488" height="74" rx="14" fill="#2d2755" stroke="#745fc0"/>
      <text x="580" y="603" class="card">2. Independent Source Validation</text><text x="580" y="628" class="small">fresh session · Candidateごとに同じsourceから独立再導出</text>
      <rect x="556" y="662" width="236" height="74" rx="14" fill="#153b30" stroke="#3e936f"/>
      <text x="674" y="694" text-anchor="middle" class="card">Finding</text><text x="674" y="718" text-anchor="middle" class="small">source-validated</text>
      <rect x="808" y="662" width="236" height="74" rx="14" fill="#17304a" stroke="#39658f"/>
      <text x="926" y="694" text-anchor="middle" class="card">Coverage</text><text x="926" y="718" text-anchor="middle" class="small">Findingとは別artifact</text>
    </g>

    <path d="M1070 505H1126" class="flow"/><rect x="1075" y="468" width="46" height="25" rx="12" fill="#153b30"/><text x="1098" y="485" text-anchor="middle" class="tiny">FINDING</text>

    <g filter="url(#shadow)">
      <rect x="1132" y="246" width="420" height="514" rx="24" fill="url(#human)" stroke="#826bd2" stroke-width="1.5"/>
      <rect x="1156" y="270" width="112" height="28" rx="14" fill="#4b367f"/><text x="1172" y="289" class="mono tiny" fill="#ded6ff">CONTEXT 3</text>
      <text x="1156" y="338" class="section">Human OS</text><text x="1156" y="370" class="body">Findingへruntime / human assuranceを追記</text>
      <rect x="1156" y="400" width="372" height="74" rx="14" fill="#352c5c" stroke="#745fc0"/>
      <text x="1178" y="431" class="card">3. Dynamic Reproduction</text><text x="1178" y="456" class="small">Finding-bound Recipeをfresh labで1回</text>
      <rect x="1156" y="490" width="372" height="74" rx="14" fill="#352c5c" stroke="#745fc0"/>
      <text x="1178" y="521" class="card">Human Verification</text><text x="1178" y="546" class="small">別fresh environmentで実効性を確認</text>
      <rect x="1156" y="580" width="372" height="74" rx="14" fill="#352c5c" stroke="#745fc0"/>
      <text x="1178" y="611" class="card">Submission Draft + Authorization</text><text x="1178" y="636" class="small">exact revision + destinationへbind</text>
      <rect x="1156" y="670" width="372" height="64" rx="14" fill="#3d3526" stroke="#9b7545"/>
      <text x="1178" y="708" class="card">Human Submit — Harnessは送信しない</text>
    </g>

    <g filter="url(#shadow)">
      <rect x="48" y="814" width="1504" height="58" rx="20" fill="#13243a" stroke="#3d6590" stroke-width="1.4"/>
      <text x="72" y="842" class="mono eyebrow" fill="#78aaff">THIN EVIDENCE SHELL</text>
      <text x="290" y="842" class="small">Snapshots · Prompt · Runtime · Permission · Budget · gVisor · Checkpoints · Receipts · append-only records</text>
      <text x="1528" y="842" text-anchor="end" class="tiny">固定Finder / Wave / class Adapterなし</text>
    </g>
  </g>
</svg>
