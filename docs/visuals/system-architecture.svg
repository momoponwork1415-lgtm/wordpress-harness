<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="390" height="1920" viewBox="0 0 390 1920" role="img" aria-labelledby="title desc" style="width:100%;max-width:390px;height:auto">
  <title id="title">WordPress Harness 全体アーキテクチャ</title>
  <desc id="desc">Target Intelligence、Research、Human OSの三つのContextを縦につなぎ、AIが判断する領域、Harnessが固定する領域、人間が承認する領域、現在の実装gapを示すスマートフォン向けの図。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#06101d"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="target" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#173653"/>
      <stop offset="1" stop-color="#10263d"/>
    </linearGradient>
    <linearGradient id="research" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#123f38"/>
      <stop offset="1" stop-color="#102b31"/>
    </linearGradient>
    <linearGradient id="human" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#37285e"/>
      <stop offset="1" stop-color="#211f45"/>
    </linearGradient>
    <filter id="shadow" x="-15%" y="-15%" width="130%" height="140%">
      <feDropShadow dx="0" dy="7" stdDeviation="8" flood-color="#000" flood-opacity="0.28"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#78aaff"/>
    </marker>
    <style>
      .sans{font-family:Inter,"Noto Sans JP",system-ui,-apple-system,"Segoe UI",sans-serif}
      .mono{font-family:"SFMono-Regular",Consolas,monospace}
      .title{fill:#f7f9fc;font-size:29px;font-weight:780;letter-spacing:-.8px}
      .subtitle{fill:#adbbce;font-size:14px}
      .section{fill:#f7f9fc;font-size:21px;font-weight:740}
      .card{fill:#f7f9fc;font-size:16px;font-weight:700}
      .body{fill:#c8d4e3;font-size:13px}
      .small{fill:#a9b7c9;font-size:11.5px}
      .tiny{fill:#91a2b8;font-size:10.5px}
      .eyebrow{font-size:10.5px;font-weight:780;letter-spacing:1.05px}
      .flow{fill:none;stroke:#78aaff;stroke-width:2.4;marker-end:url(#arrow)}
      .divider{stroke:#ffffff;stroke-opacity:.12;stroke-width:1}
    </style>
  </defs>

  <rect width="390" height="1920" fill="url(#bg)"/>
  <circle cx="350" cy="30" r="120" fill="#17345c" opacity=".36"/>
  <circle cx="25" cy="1840" r="140" fill="#123f38" opacity=".2"/>

  <g class="sans">
    <text x="22" y="38" class="mono eyebrow" fill="#78aaff">WHOLE SYSTEM · MOBILE</text>
    <text x="22" y="76" class="title">全体アーキテクチャ</text>
    <text x="22" y="105" class="subtitle">AIの判断を残し、authorityとevidenceだけ固定する。</text>

    <rect x="22" y="128" width="346" height="58" rx="18" fill="#13243a" stroke="#365d86"/>
    <circle cx="42" cy="149" r="5" fill="#68d8a2"/>
    <text x="55" y="153" class="small">AI：選ぶ・探索する・反証する</text>
    <circle cx="42" cy="169" r="5" fill="#78aaff"/>
    <text x="55" y="173" class="small">Harness：固定する・隔離する・記録する</text>

    <!-- Target Intelligence -->
    <g filter="url(#shadow)">
      <rect x="22" y="222" width="346" height="290" rx="22" fill="url(#target)" stroke="#47749c" stroke-width="1.5"/>
      <rect x="42" y="243" width="116" height="25" rx="12" fill="#244d70"/>
      <text x="55" y="260" class="mono tiny" fill="#cce6ff">CONTEXT 1</text>
      <text x="42" y="300" class="section">Target Intelligence</text>
      <text x="42" y="326" class="body">公開factからAIが調査候補を提案</text>

      <rect x="42" y="350" width="306" height="56" rx="13" fill="#183451" stroke="#416c94"/>
      <text x="59" y="374" class="card">AI Target Proposal</text>
      <text x="59" y="395" class="small">固定rankや脆弱性oracleは渡さない</text>

      <rect x="42" y="418" width="306" height="56" rx="13" fill="#183451" stroke="#416c94"/>
      <text x="59" y="442" class="card">Human Approved Batch</text>
      <text x="59" y="463" class="small">version・sourceを実行直前に再確認</text>

      <rect x="42" y="483" width="306" height="19" rx="9" fill="#604724"/>
      <text x="195" y="496" text-anchor="middle" class="tiny" fill="#ffe0ad">Approved Campaign admission</text>
    </g>

    <path d="M195 514V548" class="flow"/>
    <rect x="79" y="526" width="232" height="28" rx="14" fill="#142d4a" stroke="#315b8d"/>
    <text x="195" y="544" text-anchor="middle" class="tiny">Admitted Campaign Input</text>

    <!-- Research -->
    <g filter="url(#shadow)">
      <rect x="22" y="570" width="346" height="650" rx="22" fill="url(#research)" stroke="#328669" stroke-width="1.5"/>
      <rect x="42" y="591" width="116" height="25" rx="12" fill="#1f5a45"/>
      <text x="55" y="608" class="mono tiny" fill="#b8f2d4">CONTEXT 2</text>
      <text x="42" y="648" class="section">Research</text>
      <text x="42" y="674" class="body">一Targetをwp2shell型の連続loopで調査</text>

      <rect x="42" y="698" width="306" height="67" rx="14" fill="#163b35" stroke="#2e7a5c"/>
      <text x="59" y="724" class="card">1. Agent-led Discovery</text>
      <text x="59" y="746" class="small">仮説・読む順序・最大4 subagentはRootが判断</text>

      <path d="M195 768V797" class="flow"/>

      <rect x="42" y="801" width="306" height="67" rx="14" fill="#2d2755" stroke="#745fc0"/>
      <text x="59" y="827" class="card">2. Independent Source Validation</text>
      <text x="59" y="849" class="small">別sessionがsource反証を独立に確認</text>

      <path d="M195 871V900" class="flow"/>

      <rect x="42" y="904" width="306" height="67" rx="14" fill="#153b30" stroke="#3e936f"/>
      <text x="59" y="930" class="card">Finding</text>
      <text x="59" y="952" class="small">source-validatedだけをimmutableに生成</text>

      <line x1="42" y1="993" x2="348" y2="993" class="divider"/>
      <text x="42" y="1021" class="mono eyebrow" fill="#68d8a2">RESEARCH OUTPUT</text>
      <rect x="42" y="1038" width="145" height="62" rx="14" fill="#174438"/>
      <text x="114" y="1064" text-anchor="middle" class="card">Candidate</text>
      <text x="114" y="1087" text-anchor="middle" class="tiny">source claim</text>
      <rect x="203" y="1038" width="145" height="62" rx="14" fill="#332b5b"/>
      <text x="275" y="1064" text-anchor="middle" class="card">Finding</text>
      <text x="275" y="1087" text-anchor="middle" class="tiny">source-validated</text>

      <text x="42" y="1132" class="body">Grok優先。Claude Code / GLMは独立Adapter。</text>
      <text x="42" y="1156" class="small">Checkpoint・Budget・failureはHarnessが保存</text>
      <rect x="42" y="1173" width="306" height="27" rx="13" fill="#17304a"/>
      <text x="195" y="1191" text-anchor="middle" class="tiny">外部Interface：conduct / inspect</text>
    </g>

    <path d="M195 1222V1256" class="flow"/>
    <rect x="133" y="1234" width="124" height="28" rx="14" fill="#153b30" stroke="#3e936f"/>
    <text x="195" y="1252" text-anchor="middle" class="tiny">Finding</text>

    <!-- Human OS -->
    <g filter="url(#shadow)">
      <rect x="22" y="1278" width="346" height="420" rx="22" fill="url(#human)" stroke="#826bd2" stroke-width="1.5"/>
      <rect x="42" y="1299" width="116" height="25" rx="12" fill="#4b367f"/>
      <text x="55" y="1316" class="mono tiny" fill="#ded6ff">CONTEXT 3</text>
      <text x="42" y="1356" class="section">Human OS</text>
      <text x="42" y="1382" class="body">Findingへruntime / human assuranceを追記</text>

      <rect x="42" y="1406" width="306" height="61" rx="14" fill="#352c5c" stroke="#745fc0"/>
      <text x="59" y="1431" class="card">3. Dynamic Reproduction</text>
      <text x="59" y="1453" class="small">Finding-bound Recipeをfresh labで1回replay</text>

      <rect x="42" y="1479" width="306" height="61" rx="14" fill="#352c5c" stroke="#745fc0"/>
      <text x="59" y="1504" class="card">Human Verification</text>
      <text x="59" y="1526" class="small">別fresh環境で確認し、Draftを承認</text>

      <rect x="42" y="1552" width="306" height="57" rx="14" fill="#3a2f55" stroke="#745fc0"/>
      <text x="59" y="1577" class="card">Human Submit</text>
      <text x="59" y="1599" class="small">exact Draft + destinationへの明示承認</text>

      <rect x="42" y="1623" width="145" height="56" rx="14" fill="#604724"/>
      <text x="114" y="1647" text-anchor="middle" class="card">Runtime</text>
      <text x="114" y="1668" text-anchor="middle" class="tiny">assurance record</text>
      <rect x="203" y="1623" width="145" height="56" rx="14" fill="#604724"/>
      <text x="275" y="1647" text-anchor="middle" class="card">Human</text>
      <text x="275" y="1668" text-anchor="middle" class="tiny">verification record</text>
    </g>

    <!-- Fixed shell -->
    <g filter="url(#shadow)">
      <rect x="22" y="1742" width="346" height="126" rx="20" fill="#13243a" stroke="#3d6590" stroke-width="1.4"/>
      <text x="42" y="1773" class="mono eyebrow" fill="#78aaff">THIN EVIDENCE SHELL</text>
      <text x="42" y="1800" class="body">Snapshot · Prompt · Permission · Budget</text>
      <text x="42" y="1824" class="body">gVisor Adapter · Checkpoint · append-only Record</text>
      <text x="42" y="1848" class="small">Depth / Wave / fixed role / class Adapterは持たない</text>
    </g>

    <text x="195" y="1895" text-anchor="middle" class="tiny">AIが研究判断 · Harnessが証拠と制約 · Humanが外部行動</text>
  </g>
</svg>
